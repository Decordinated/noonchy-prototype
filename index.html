      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>전체 내역</h2>
        <span class="spacer"></span>
        <${SearchInput} value=${q} onInput=${(v) => { setQ(v); setLimit(50); }} placeholder="사용자 이름, 이메일" style=${{ width: mobile ? '100%' : '220px' }} />
        <${Seg} label="내역 종류" value=${f} onChange=${(v) => { setF(v); setLimit(50); }} options=${[{ value: 'all', label: '전체', count: count('all') }, { value: 'grant', label: '지급', count: count('grant') }, { value: 'spend', label: '사용', count: count('spend') }, { value: 'refund', label: '환불', count: count('refund') }, { value: 'revoke', label: '회수', count: count('revoke') }]} />
      </div>
      <${AdLedger} rows=${rows.slice(0, limit)} showUser mobile=${mobile} />
      ${rows.length > 0 && html`<div class="card-foot"><span class="tiny muted grow">${Math.min(limit, rows.length)} / ${rows.length}줄</span>${rows.length > limit && html`<button type="button" class="btn btn-sm" onClick=${() => setLimit(limit + 50)}>더 보기 (${rows.length - limit}줄 남음)</button>`}</div>`}
    </div>
  </div>`;
}
PAGES['admin-credits'] = AdCreditsPage;

// ── 분석 엔진 ─────────────────────────────────────
function AdEngineCard({ kind }) {
  const saved = db.settings.engines[kind];
  const [d, setD] = useState(() => adNormEngine(saved));
  const dirty = JSON.stringify(d) !== JSON.stringify(adNormEngine(saved));
  const eng = engineOf(d.engine); const model = modelOf(d.engine, d.model);
  const fbEng = engineOf(d.fallback.engine); const fbModel = modelOf(d.fallback.engine, d.fallback.model);
  const savedModel = modelOf(saved.engine, saved.model);
  const price = (m) => (kind === 'reference' ? m.ref : m.score);
  const sameAsMain = d.fallback.enabled && d.fallback.engine === d.engine && fbModel.key === model.key;
  const u30 = adUsage(kind);
  const meta = AD_KIND[kind];
  const setFb = (patch) => setD({ ...d, fallback: { ...d.fallback, ...patch } });
  const save = () => {
    if (sameAsMain) return;
    setEngine(kind, d);
    toast({ title: `${meta.title} 엔진을 저장했어요`, body: `${eng.name} · ${model.name}${d.fallback.enabled ? ` · 예비 ${fbModel.name}` : ''} · 다음 작업부터 써요` });
  };
  const diff = price(model) - price(savedModel);
  const unit = kind === 'reference' ? '1편' : '1회';
  return html`<div class=${'card' + (dirty ? ' focus' : '')}>
    <div class="card-head" style=${{ flexWrap: 'nowrap', alignItems: 'flex-start' }}>
      <span class="stat-icon"><${Icon} name=${meta.icon} size="sm" /></span>
      <div style=${{ flex: '1 1 0', minWidth: 0 }}><h2>${meta.title}</h2><div class="card-sub">${meta.desc}</div></div>
      ${dirty ? html`<span class="badge badge-warn">저장 안 됨</span>` : html`<span class="badge badge-outline">사용 중</span>`}
    </div>
    <div class="card-pad stack" style=${{ paddingTop: 0 }}>
      <div class="ad-fields">
        <${Field} label="엔진" htmlFor=${'ad-eng-' + kind} hint=${eng.note}>
          <select id=${'ad-eng-' + kind} class="select" value=${d.engine} onChange=${(e) => { const k = e.target.value; setD({ ...d, engine: k, model: engineOf(k).models[0].key }); }}>
            ${ENGINES.map((e) => html`<option value=${e.key}>${e.name}${e.dev ? ' · 개발용' : ''}</option>`)}
          </select>
        <//>
        <${Field} label="모델" htmlFor=${'ad-model-' + kind}>
          <select id=${'ad-model-' + kind} class="select" value=${model.key} onChange=${(e) => setD({ ...d, model: e.target.value })}>
            ${eng.models.map((m) => html`<option value=${m.key}>${m.name}</option>`)}
          </select>
        <//>
      </div>
      ${eng.dev && html`<${Callout} tone="warn" icon="alert">맥에 로그인된 구독 계정으로 도는 개발용이에요. 운영에서는 API 키 엔진만 써요.<//>`}
      ${d.engine === 'openai-api' && html`<${Callout} tone="warn" icon="lock">서버에 OPENAI_API_KEY가 아직 없어요. 키를 넣어야 이 엔진으로 작업이 돌아요.<//>`}
      <${Field} label="생각 깊이 (effort)" htmlFor=${'ad-effort-' + kind} hint="높을수록 출력이 길어져 느리고 비용이 늘어요. 기본은 낮음이에요.">
        <select id=${'ad-effort-' + kind} class="select" value=${d.effort} onChange=${(e) => setD({ ...d, effort: e.target.value })}>${AD_EFFORT.map((o) => html`<option value=${o.value}>${o.label}</option>`)}</select>
      <//>
      <div class="ad-cost">
        <${Icon} name="coins" size="sm" />
        <div class="grow stack-sm" style=${{ gap: '2px' }}>
          <span class="small strong">${eng.dev ? '구독 계정으로 돌아서 건별 API 비용이 없어요' : kind === 'reference' ? `60초 쇼츠 1편 약 ${fmtUsd(model.ref)} · 1,000편 약 ${adUsd1000(model.ref)}` : `채점 1회 약 ${fmtUsd(model.score)} · 1,000회 약 ${adUsd1000(model.score)}`}</span>
          ${!eng.dev && html`<span class="tiny muted">최근 30일 작업량(${u30.ok.toLocaleString('ko-KR')}건)이면 약 ${fmtUsd(price(model) * u30.ok)}${kind === 'reference' ? ' · 60초 기준' : ''}</span>`}
          ${dirty && !eng.dev && Math.abs(diff) >= 0.0005 && html`<span class="tiny" style=${{ color: diff < 0 ? 'var(--ok)' : 'var(--warn)' }}>지금 설정(${savedModel.name})보다 ${unit}당 ${fmtUsd(Math.abs(diff))} ${diff < 0 ? '싸요' : '비싸요'}</span>`}
        </div>
      </div>
      <div class="divider"></div>
      <label class="row" style=${{ gap: '12px', cursor: 'pointer' }}>
        <input type="checkbox" role="switch" class="ad-switch" checked=${d.fallback.enabled} onChange=${(e) => setFb({ enabled: e.target.checked })} aria-label=${meta.title + ' 예비 엔진 쓰기'} />
        <span class="grow stack-sm" style=${{ gap: 0 }}><span class="small strong">예비 엔진</span><span class="tiny muted">주 엔진이 실패하면 이 엔진으로 한 번 더 돌려요</span></span>
      </label>
      ${d.fallback.enabled && html`<div class="ad-fields">
        <${Field} label="예비 엔진" htmlFor=${'ad-fbeng-' + kind}>
          <select id=${'ad-fbeng-' + kind} class="select" value=${d.fallback.engine} onChange=${(e) => { const k = e.target.value; setFb({ engine: k, model: engineOf(k).models[0].key }); }}>
            ${ENGINES.map((e) => html`<option value=${e.key}>${e.name}${e.dev ? ' · 개발용' : ''}</option>`)}
          </select>
        <//>
        <${Field} label="예비 모델" htmlFor=${'ad-fbmodel-' + kind}>
          <select id=${'ad-fbmodel-' + kind} class="select" value=${fbModel.key} onChange=${(e) => setFb({ model: e.target.value })}>
            ${fbEng.models.map((m) => html`<option value=${m.key}>${m.name}</option>`)}
          </select>
        <//>
      </div>`}
      ${sameAsMain && html`<div class="error-text" role="alert">주 엔진과 같은 모델이에요. 다른 엔진이나 모델을 골라 주세요.</div>`}
      ${d.fallback.enabled && !sameAsMain && fbEng.dev && html`<div class="tiny" style=${{ color: 'var(--warn)' }}>예비 엔진도 개발용이에요. 운영에서는 API 키 엔진을 골라 주세요.</div>`}
      ${d.fallback.enabled && !sameAsMain && d.fallback.engine === 'openai-api' && d.engine !== 'openai-api' && html`<div class="tiny" style=${{ color: 'var(--warn)' }}>OPENAI_API_KEY가 없어서 지금은 예비 엔진이 돌지 않아요.</div>`}
    </div>
    <div class="card-foot">
      <span class=${'tiny grow ' + (dirty ? 'strong' : 'muted')}>${dirty ? '저장하지 않은 변경이 있어요' : '저장됨 · 바꾸면 다음 작업부터 써요'}</span>
      ${dirty && html`<button type="button" class="btn btn-ghost btn-sm" onClick=${() => setD(adNormEngine(saved))}>되돌리기</button>`}
      <button type="button" class="btn btn-primary btn-sm" disabled=${!dirty || sameAsMain} onClick=${save}>저장</button>
    </div>
  </div>`;
}

function AdKeysCard() {
  const eng = db.settings.engines;
  const usedBy = (key) => ['reference', 'score'].flatMap((k) => [eng[k].engine === key ? AD_KIND[k].title : null, eng[k].fallback.enabled && eng[k].fallback.engine === key ? `${AD_KIND[k].title} 예비` : null]).filter(Boolean);
  return html`<div class="card">
    <div class="card-head"><h2 class="grow">API 키 상태</h2><span class="card-sub">서버 환경 변수</span></div>
    ${AD_ENV_KEYS.map((k) => { const uses = usedBy(k.engine); return html`<div class="list-row" key=${k.key}>
      <span class="ad-feed-ico"><${Icon} name="lock" size="sm" /></span>
      <div class="grow stack-sm" style=${{ gap: 0 }}><span class="mono small strong">${k.key}</span><span class="tiny muted">${engineOf(k.engine).name}${uses.length ? ` · ${uses.join(', ')}에서 씀` : ' · 지금 쓰는 작업 없음'}</span></div>
      ${k.set ? html`<span class="badge badge-ok"><${Icon} name="check" size="xs" />설정됨</span>` : html`<span class="badge badge-warn"><${Icon} name="alert" size="xs" />없음</span>`}
    </div>`; })}
    <div class="list-row">
      <span class="ad-feed-ico"><${Icon} name="cpu" size="sm" /></span>
      <div class="grow stack-sm" style=${{ gap: 0 }}><span class="small strong">Claude Code, Codex CLI</span><span class="tiny muted">맥에 로그인된 구독 계정 · 키 없이 흐름만 시험해요</span></div>
      <span class="badge badge-outline">개발용</span>
    </div>
    <div class="card-foot"><${Icon} name="info" size="xs" /><span class="tiny muted">API 키는 서버 환경 변수에만 두고 화면에서는 바꿀 수 없어요.</span></div>
  </div>`;
}

function AdUsageSection() {
  const mobile = useMedia(adMobileQuery);
  const [k, setK] = useState('all');
  const u = adUsage(k);
  const ref = adUsage('reference'); const sc = adUsage('score');
  const rate = u.jobs ? (u.failed / u.jobs) * 100 : 0;
  const data = u.days.map((d, i) => ({ label: i === 29 ? '오늘' : fmtDate(d.at), value: d.jobs })); // 날짜는 5일마다만 보여요 (CSS)
  return html`<div class="stack">
    <div class="row-wrap" style=${{ justifyContent: 'space-between' }}>
      <div><h2 class="section-title">최근 30일 사용량</h2><div class="small muted">엔진 호출마다 남긴 작업 수, 시간, 비용이에요.</div></div>
      <${Seg} label="작업 종류" value=${k} onChange=${setK} options=${[{ value: 'all', label: '전체' }, { value: 'reference', label: '정답지' }, { value: 'score', label: '채점' }]} />
    </div>
    <div class="grid-auto ad-stats">
      <${Stat} label="작업 수" value=${u.jobs} unit="건" icon="tasks" sub=${k === 'all' ? `정답지 ${ref.jobs} · 채점 ${sc.jobs}` : `하루 평균 ${(u.jobs / 30).toFixed(1)}건`} />
      <${Stat} label="평균 시간" value=${u.ok ? fmtMs(u.ms) : '–'} icon="timer" sub=${k === 'all' ? `정답지 ${fmtMs(ref.ms)} · 채점 ${fmtMs(sc.ms)}` : '성공한 작업 기준'} />
      <${Stat} label="비용" value=${fmtUsd(u.cost)} icon="coins" sub=${`하루 평균 ${fmtUsd(u.cost / 30)} · 1건당 ${fmtUsd(u.ok ? u.cost / u.ok : 0)}`} />
      <${Stat} label="실패율" value=${rate.toFixed(1) + '%'} icon="alert" sub=${`실패 ${u.failed}건 · 학생 크레딧은 자동 환불`} />
    </div>
    <div class="card">
      <div class="card-head"><h2 class="grow">하루 작업 수</h2><span class="card-sub">${k === 'all' ? '정답지 + 채점' : k === 'reference' ? '정답지 생성' : '채점'}</span></div>
      <div class="card-pad ad-chart" style=${{ paddingTop: '8px' }}>
        <${BarChart} data=${data} height=${170} fmt=${(v) => v + '건'} />
      </div>
      ${mobile ? html`<div>${[['reference', ref], ['score', sc]].map(([kk, x]) => html`<div class="list-row" key=${kk}>
        <span class="ad-feed-ico"><${Icon} name=${AD_KIND[kk].icon} size="sm" /></span>
        <div class="grow stack-sm" style=${{ gap: '1px' }}><span class="small strong">${AD_KIND[kk].title}</span><span class="tiny muted">작업 ${x.jobs} · 실패 ${x.failed} · 평균 ${x.ok ? fmtMs(x.ms) : '–'}</span></div>
        <div class="stack-sm ad-r" style=${{ gap: '1px' }}><span class="small strong num">${fmtUsd(x.cost)}</span><span class="tiny muted num">건당 ${fmtUsd(x.ok ? x.cost / x.ok : 0)}</span></div>
      </div>`)}</div>` : html`<div class="table-wrap"><table class="table">
        <thead><tr><th>종류</th><th class="ad-r">작업</th><th class="ad-r">실패</th><th class="ad-r">평균 시간</th><th class="ad-r">비용</th><th class="ad-r">1건당</th></tr></thead>
        <tbody>${[['reference', ref], ['score', sc]].map(([kk, x]) => html`<tr key=${kk}>
          <td><span class="row" style=${{ gap: '8px' }}><${Icon} name=${AD_KIND[kk].icon} size="xs" /><span class="strong">${AD_KIND[kk].title}</span></span></td>
          <td class="num ad-r">${x.jobs}</td><td class="num ad-r">${x.failed}</td><td class="num ad-r">${x.ok ? fmtMs(x.ms) : '–'}</td><td class="num ad-r">${fmtUsd(x.cost)}</td><td class="num ad-r">${fmtUsd(x.ok ? x.cost / x.ok : 0)}</td>
        </tr>`)}</tbody>
      </table></div>`}
    </div>
  </div>`;
}

function AdModelTable() {
  const mobile = useMedia(adMobileQuery);
  const eng = db.settings.engines;
  const tagsFor = (e, m) => {
    const t = [];
    for (const k of ['reference', 'score']) {
      if (eng[k].engine === e.key && eng[k].model === m.key) t.push(AD_KIND[k].title);
      if (eng[k].fallback.enabled && eng[k].fallback.engine === e.key && eng[k].fallback.model === m.key) t.push(`${AD_KIND[k].title} 예비`);
    }
    return t;
  };
  const rows = ENGINES.filter((e) => !e.dev).flatMap((e) => e.models.map((m) => ({ e, m, tags: tagsFor(e, m) })));
  return html`<div class="card">
    <div class="card-head"><h2 class="grow">모델 비용 비교</h2><span class="card-sub">지금 쓰는 모델을 표시했어요</span></div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>모델</th><th class="ad-r">${mobile ? '정답지' : '정답지 1회 (60초)'}</th><th class="ad-r">${mobile ? '채점' : '채점 1회'}</th><th class="ad-r">${mobile ? '1,000편' : '60초 1,000편 환산'}</th></tr></thead>
      <tbody>${rows.map(({ e, m, tags }) => html`<tr class=${tags.length ? 'ad-hi' : ''} key=${e.key + m.key}>
        <td><div class="stack-sm" style=${{ gap: '2px' }}><span class=${tags.length ? 'strong' : ''}>${m.name}</span><span class="row-wrap" style=${{ gap: '4px' }}><span class="tiny muted">${e.name}</span>${tags.map((t) => html`<span class="badge badge-solid">${t}</span>`)}</span></div></td>
        <td class="num ad-r">${fmtUsd(m.ref)}</td>
        <td class="num ad-r">${fmtUsd(m.score)}</td>
        <td class="num ad-r strong">${adUsd1000(m.ref)}</td>
      </tr>`)}</tbody>
    </table></div>
    <div class="card-foot"><span class="tiny muted">60초 쇼츠, 2fps 512px 프레임 기준 추정이에요 (2026-10-16 공식 가격). 작은 모델은 수십 배 싸지만, 품질은 선생님 정답지로 만든 평가 세트로 비교해서 골라요. 개발용 CLI 엔진은 건별 비용이 없어서 뺐어요.</span></div>
  </div>`;
}

function AdEnginesPage() {
  return html`<div class="stack-lg">
    <div class="page-head"><div class="grow"><h2>분석 엔진</h2><p>작업 종류마다 엔진과 모델을 골라요. 저장하면 다음 작업부터 써요. 진행 중인 작업은 그대로 돌아요.</p></div></div>
    <div class="grid-2" style=${{ alignItems: 'start' }}><${AdEngineCard} kind="reference" /><${AdEngineCard} kind="score" /></div>
    <${AdKeysCard} />
    <${AdUsageSection} />
    <${AdModelTable} />
  </div>`;
}
PAGES.engines = AdEnginesPage;

loadDb();
applyTheme();
tick();
setInterval(tick, 400);
const mount = document.getElementById('app');
mount.textContent = '';
render(html`<${App} />`, mount);

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>noonchy 프로토타입</title>
<meta name="description" content="noonchy 학생, 선생님, 관리자 전체 화면을 서버 없이 눌러 볼 수 있는 프로토타입">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* noonchy 프로토타입 · 레이아웃: 아이콘 레일 | 헤더 + 콘텐츠 | 우측 보조 패널 (스펙 0003, 0010)
   중립색은 모드 색(hue)으로 아주 살짝 물들고, 강조색은 모드 색에서만 옵니다 (스펙 0004). */
:root, [data-mode] {
  --role: oklch(0.52 calc(0.19 * var(--c)) var(--hue));
  --role-strong: oklch(0.43 calc(0.17 * var(--c)) var(--hue));
  --role-fg: oklch(0.99 0 0);
  --role-soft: oklch(0.985 calc(0.008 * var(--c)) var(--hue));
  --role-muted: oklch(0.95 calc(0.03 * var(--c)) var(--hue));
  --role-border: oklch(0.87 calc(0.06 * var(--c)) var(--hue));
  --bg: var(--role-soft);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.975 calc(0.005 * var(--c)) var(--hue));
  --surface-3: oklch(0.955 calc(0.006 * var(--c)) var(--hue));
  --line: oklch(0.92 calc(0.008 * var(--c)) var(--hue));
  --line-strong: oklch(0.86 calc(0.01 * var(--c)) var(--hue));
  --fg: oklch(0.21 0.006 var(--hue));
  --fg-2: oklch(0.42 0.012 var(--hue));
  --fg-3: oklch(0.54 0.012 var(--hue));
  --ink: oklch(0.21 0.006 var(--hue));
  --on-ink: oklch(0.99 0 0);
  --video: oklch(0.2 0.012 var(--hue));
  --ok: oklch(0.52 0.13 152);
  --ok-soft: oklch(0.95 0.04 152);
  --warn: oklch(0.55 0.13 70);
  --warn-soft: oklch(0.96 0.05 85);
  --bad: oklch(0.52 0.19 27);
  --bad-soft: oklch(0.95 0.035 27);
  --shadow: 0 1px 2px oklch(0.2 0.01 var(--hue) / 0.06), 0 8px 24px oklch(0.2 0.01 var(--hue) / 0.08);
  --shadow-lg: 0 2px 6px oklch(0.2 0.01 var(--hue) / 0.08), 0 24px 60px oklch(0.2 0.01 var(--hue) / 0.18);
}
:root { --hue: 255; --c: 0.5; --font: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; --r-card: 18px; --r-ctl: 11px; }
[data-mode="student"] { --hue: 255; --c: 1; }
[data-mode="teacher"] { --hue: 25; --c: 1.05; }
[data-mode="admin"] { --hue: 260; --c: 0; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]), :root:not([data-theme="light"]) [data-mode] {
    --role: oklch(0.7 calc(0.15 * var(--c)) var(--hue));
    --role-strong: oklch(0.82 calc(0.11 * var(--c)) var(--hue));
    --role-fg: oklch(0.17 0.01 var(--hue));
    --role-soft: oklch(0.17 calc(0.014 * var(--c)) var(--hue));
    --role-muted: oklch(0.27 calc(0.045 * var(--c)) var(--hue));
    --role-border: oklch(0.42 calc(0.07 * var(--c)) var(--hue));
    --surface: oklch(0.205 0.008 var(--hue));
    --surface-2: oklch(0.235 0.01 var(--hue));
    --surface-3: oklch(0.27 0.012 var(--hue));
    --line: oklch(0.3 0.012 var(--hue));
    --line-strong: oklch(0.38 0.014 var(--hue));
    --fg: oklch(0.96 0.004 var(--hue));
    --fg-2: oklch(0.8 0.01 var(--hue));
    --fg-3: oklch(0.68 0.012 var(--hue));
    --ink: oklch(0.95 0.004 var(--hue));
    --on-ink: oklch(0.18 0.01 var(--hue));
    --video: oklch(0.13 0.01 var(--hue));
    --ok: oklch(0.74 0.13 152); --ok-soft: oklch(0.3 0.05 152);
    --warn: oklch(0.8 0.12 80); --warn-soft: oklch(0.32 0.05 80);
    --bad: oklch(0.72 0.16 27); --bad-soft: oklch(0.3 0.06 27);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.35);
    --shadow-lg: 0 2px 6px oklch(0 0 0 / 0.35), 0 24px 60px oklch(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-theme="dark"] [data-mode] {
  --role: oklch(0.7 calc(0.15 * var(--c)) var(--hue));
  --role-strong: oklch(0.82 calc(0.11 * var(--c)) var(--hue));
  --role-fg: oklch(0.17 0.01 var(--hue));
  --role-soft: oklch(0.17 calc(0.014 * var(--c)) var(--hue));
  --role-muted: oklch(0.27 calc(0.045 * var(--c)) var(--hue));
  --role-border: oklch(0.42 calc(0.07 * var(--c)) var(--hue));
  --surface: oklch(0.205 0.008 var(--hue));
  --surface-2: oklch(0.235 0.01 var(--hue));
  --surface-3: oklch(0.27 0.012 var(--hue));
  --line: oklch(0.3 0.012 var(--hue));
  --line-strong: oklch(0.38 0.014 var(--hue));
  --fg: oklch(0.96 0.004 var(--hue));
  --fg-2: oklch(0.8 0.01 var(--hue));
  --fg-3: oklch(0.68 0.012 var(--hue));
  --ink: oklch(0.95 0.004 var(--hue));
  --on-ink: oklch(0.18 0.01 var(--hue));
  --video: oklch(0.13 0.01 var(--hue));
  --ok: oklch(0.74 0.13 152); --ok-soft: oklch(0.3 0.05 152);
  --warn: oklch(0.8 0.12 80); --warn-soft: oklch(0.32 0.05 80);
  --bad: oklch(0.72 0.16 27); --bad-soft: oklch(0.3 0.06 27);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.35);
  --shadow-lg: 0 2px 6px oklch(0 0 0 / 0.35), 0 24px 60px oklch(0 0 0 / 0.5);
  color-scheme: dark;
}

/* 관리자: 무채색, 강조는 거의 검정 (스펙 0004), 다크에서는 거의 흰색 */
[data-mode="admin"] { --role: oklch(0.21 0 0); --role-strong: oklch(0.21 0 0); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-mode="admin"], :root:not([data-theme="light"]) [data-mode="admin"] { --role: oklch(0.9 0 0); --role-strong: oklch(0.96 0 0); --role-fg: oklch(0.17 0 0); }
}
:root[data-theme="dark"][data-mode="admin"], :root[data-theme="dark"] [data-mode="admin"] { --role: oklch(0.9 0 0); --role-strong: oklch(0.96 0 0); --role-fg: oklch(0.17 0 0); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
#app { min-height: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--role-strong); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--role); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }
.soft { color: var(--fg-2); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.strong { font-weight: 600; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row-top { display: flex; align-items: flex-start; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.spacer { flex: 1 1 auto; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 15px; height: 15px; }
.icon-xs { width: 13px; height: 13px; }
.icon-lg { width: 22px; height: 22px; }
.icon .fill { fill: currentColor; stroke: none; }

/* ── 앱 틀 ───────────────────────────── */
.app { display: flex; min-height: 100vh; background: var(--bg); transition: background-color .2s ease; }
.rail { flex: 0 0 72px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 0 12px 16px; border-right: 1px solid var(--line); background: var(--role-soft); position: sticky; top: 0; height: 100vh; transition: flex-basis .2s ease; z-index: 20; }
.rail.expanded { flex-basis: 232px; }
.rail-logo { height: 72px; display: flex; align-items: center; gap: 10px; margin: 0 -12px 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.logo-mark { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--role); color: var(--role-fg); display: grid; place-items: center; }
.logo-word { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.rail-item { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 13px; border-radius: 12px; color: var(--fg-2); border: 0; background: transparent; text-align: left; white-space: nowrap; overflow: hidden; position: relative; }
.rail-item:hover { background: var(--role-muted); color: var(--fg); text-decoration: none; }
.rail-item[aria-current="page"] { background: var(--role-muted); color: var(--role-strong); font-weight: 600; }
.rail-item .label { font-size: 14px; }
.rail:not(.expanded) .rail-item .label, .rail:not(.expanded) .logo-word { display: none; }
.rail-sep { height: 1px; background: var(--line); margin: 8px 6px; }
.rail .tip { position: absolute; }
.main-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; height: 72px; display: flex; align-items: center; gap: 10px; padding: 0 max(24px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.header h1 { font-size: 19px; font-weight: 600; }
.header-title { min-width: 0; display: flex; flex-direction: column; }
.crumb { font-size: 12px; color: var(--fg-3); }
.body-row { flex: 1 1 auto; display: flex; min-height: 0; }
.content { flex: 1 1 auto; min-width: 0; padding: 28px max(28px, env(safe-area-inset-right, 0px)) 48px max(28px, env(safe-area-inset-left, 0px)); }
.content-narrow { max-width: 1160px; margin: 0 auto; }
.aside { flex: 0 0 360px; border-left: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; position: sticky; top: 72px; height: calc(100vh - 72px); }
.aside-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px; }
.aside-body { flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.aside-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); }
.proto-bar { display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: 12px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--ink); color: var(--on-ink); }
.proto-bar button { border: 0; background: transparent; color: inherit; text-decoration: underline; padding: 0; font-size: 12px; }
.mobile-only { display: none; }
@media (max-width: 1279px) {
  .aside { position: fixed; right: 0; top: 0; bottom: 0; height: 100vh; width: min(380px, 100vw); z-index: 60; box-shadow: var(--shadow-lg); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
}
@media (max-width: 767px) {
  .rail { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform .2s ease; flex-basis: auto; width: 248px; z-index: 70; box-shadow: var(--shadow-lg); padding-top: env(safe-area-inset-top, 0px); padding-left: max(12px, env(safe-area-inset-left, 0px)); }
  .rail.open { transform: none; }
  .rail .rail-item .label, .rail .logo-word { display: inline !important; }
  .mobile-only { display: inline-flex; }
  .desktop-only { display: none !important; }
  .header { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); height: 64px; gap: 4px; }
  .header .btn-icon { width: 36px; }
  .header h1 { font-size: 17px; }
  .content { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .aside { top: 0; }
}
.scrim { position: fixed; inset: 0; background: oklch(0.15 0.01 var(--hue) / 0.42); z-index: 55; }

/* ── 기본 요소 ───────────────────────── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); min-width: 0; }
.card-pad { padding: 20px 22px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 12px; flex-wrap: wrap; }
.card-head h2, .card-title { font-size: 16px; font-weight: 600; }
.card-sub { font-size: 12.5px; color: var(--fg-3); }
.card-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-card) var(--r-card); }
.card.focus { border-color: var(--role-border); box-shadow: 0 0 0 4px var(--role-muted); }
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h2 { font-size: 21px; font-weight: 600; }
.page-head p { color: var(--fg-3); font-size: 13.5px; margin-top: 2px; }
.section-title { font-size: 16px; font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 15px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 13.5px; font-weight: 500; white-space: nowrap; text-decoration: none !important; transition: background-color .15s, border-color .15s, opacity .15s; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--role); color: var(--role-fg); border-color: transparent; font-weight: 600; }
.btn-primary:hover { background: var(--role-strong); }
:root[data-theme="dark"] .btn-primary:hover { background: var(--role); filter: brightness(1.08); }
.btn-dark { background: var(--ink); color: var(--on-ink); border-color: transparent; }
.btn-dark:hover { background: var(--ink); opacity: .88; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--surface-3); color: var(--fg); }
.btn-danger { color: var(--bad); }
.btn-sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 9px; }
.btn-lg { height: 48px; padding: 0 20px; font-size: 14.5px; border-radius: 12px; }
.btn-icon { width: 40px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn-block { width: 100%; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 12.5px; font-weight: 500; color: var(--fg-2); }
.hint { font-size: 12px; color: var(--fg-3); }
.error-text { font-size: 12.5px; color: var(--bad); }
.input, .textarea, .select { width: 100%; min-width: 0; height: 40px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 14px; transition: border-color .15s, box-shadow .15s; }
.textarea { height: auto; padding: 10px 12px; line-height: 1.6; resize: vertical; min-height: 64px; }
.select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--role); box-shadow: 0 0 0 3px var(--role-muted); }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--bad); }
.input-wrap { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg-3); min-width: 0; }
.input-wrap:focus-within { border-color: var(--role); box-shadow: 0 0 0 3px var(--role-muted); }
.input-wrap input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; outline: none; height: 100%; color: var(--fg); font-size: 14px; }
.checkbox { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.checkbox input { width: 16px; height: 16px; accent-color: var(--role); }

.seg { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); max-width: 100%; overflow-x: auto; }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--fg-2); font-size: 13px; white-space: nowrap; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--role-muted); color: var(--role-strong); font-weight: 600; }
.seg .count { margin-left: 4px; font-variant-numeric: tabular-nums; opacity: .8; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--role-muted); border-color: var(--role-border); color: var(--role-strong); font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 3px 10px; border-radius: 8px; background: var(--surface-3); color: var(--fg); font-size: 12.5px; }
.tag button { border: 0; background: transparent; padding: 0; color: var(--fg-3); display: inline-grid; }
.tag-time { font-family: var(--mono); font-size: 12px; }
.tag-add { border: 1px dashed var(--line-strong); background: var(--surface); color: var(--fg-2); }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--fg-2); }
.badge-role { background: var(--role-muted); color: var(--role-strong); }
.badge-solid { background: var(--role); color: var(--role-fg); }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-bad { background: var(--bad-soft); color: var(--bad); }
.badge-outline { background: transparent; border: 1px solid var(--line-strong); font-weight: 500; }
.badge-dashed { background: transparent; border: 1px dashed var(--role-border); color: var(--role-strong); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 999px; background: var(--role); flex: none; }

.progress { height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; min-width: 40px; }
.progress > span { display: block; height: 100%; background: var(--role); border-radius: inherit; transition: width .4s ease; }
.progress.indeterminate > span { width: 35% !important; animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--fg-3); padding: 11px 12px; background: var(--surface-2); white-space: nowrap; }
.table td { padding: 11px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
.table th:first-child, .table td:first-child { padding-left: 20px; }
.table th:last-child, .table td:last-child { padding-right: 20px; }
.table tr.clickable { cursor: pointer; }

kbd, .kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; padding: 0 5px; background: var(--surface); color: var(--fg-2); line-height: 18px; display: inline-block; }

.toast { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow-lg); font-size: 13.5px; animation: toastIn .2s ease; }

.transcript-line { display: flex; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 13px; color: var(--fg); }

/* ── 루브릭 항목 ────────────────────── */
.item-num { width: 26px; height: 26px; flex: none; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-3); color: var(--fg-2); border: 1.5px solid transparent; }

.seg-bar { display: flex; height: 30px; gap: 2px; border-radius: 8px; overflow: hidden; font-size: 12px; font-weight: 500; }

@media (max-width: 767px) { .stepper .lab { display: none; } }
del.diff { color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
ins.diff { text-decoration: none; background: var(--surface-3); border-bottom: 2px solid var(--fg-2); font-weight: 500; }

.hbar { display: flex; align-items: center; gap: 12px; }
.hbar .name { width: 76px; flex: none; font-size: 13px; color: var(--fg-2); }
.hbar .track { flex: 1 1 auto; height: 8px; border-radius: 8px; background: var(--surface-3); overflow: hidden; }

.score-ring { --p: 0; width: 120px; height: 120px; border-radius: 999px; background: conic-gradient(var(--role) calc(var(--p) * 1%), var(--surface-3) 0); display: grid; place-items: center; flex: none; }

.spark { display: block; width: 100%; height: 56px; }

.spark path.area { fill: var(--role-muted); stroke: none; }

/* ── 로그인 ─────────────────────────── */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@container testudio (max-width: 520px) {
  .te-player-box { width: min(100%, 196px); }
  .te-tr-scroll { max-height: 164px; }
  .te-item-head { padding: 12px 14px; gap: 10px; }
  .te-item-body { padding: 2px 14px 14px; }
}

/* 학생 결과 */
.te-stable th.te-num, .te-stable td.te-num { text-align: right; }
.te-low { display: inline-block; min-width: 30px; padding: 1px 6px; border-radius: 6px; background: var(--role-muted); color: var(--role-strong); font-weight: 700; text-align: center; }
.te-sel td { background: var(--role-muted); }
.table tr.clickable.te-sel:hover td { background: var(--role-muted); }
.te-detail { scroll-margin-top: 90px; }
.te-detail-body { display: flex; flex-direction: column; gap: 20px; padding: 4px 20px 20px; }
.te-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.te-chart svg { overflow: visible; }
.te-chart { padding-right: 10px; }
@media (max-width: 600px) { .te-chart svg text { font-size: 20px; } .te-chart { padding-left: 6px; } }
.te-subhead { padding: 14px 20px 8px; font-size: 13px; font-weight: 600; color: var(--fg-2); border-top: 1px solid var(--line); }
.te-sub + .te-sub { border-top: 1px solid var(--line); }
.te-sub-body { padding: 2px 20px 16px 66px; display: flex; flex-direction: column; gap: 12px; }
.te-fb { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.te-score { font-size: 18px; font-weight: 600; white-space: nowrap; }
.te-score small { margin-left: 2px; font-size: 12px; font-weight: 500; color: var(--fg-3); }
@media (max-width: 767px) { .te-sub-body { padding-left: 20px; } }
@media (max-width: 600px) {
  .te-bars .bars, .te-bars .xlabels { gap: 4px; }
  .te-bars .xlabels { font-size: 10.5px; padding-inline: 0; }
}

/* ── 관리자 화면 (pages-admin.js) ── 촘촘한 운영 콘솔. 색은 모드 토큰과 --ok/--warn/--bad만 씁니다. */
.table th.ad-r, .table td.ad-r, .ad-r { text-align: right; }
.ad-link { border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; max-width: 100%; }
.ad-link:hover { text-decoration: underline; }
.ad-link.ellipsis { display: block; }
.ad-actions { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: nowrap; white-space: nowrap; }
.list-row .ad-actions { justify-content: flex-start; flex-wrap: wrap; }
.ad-feed-ico { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-3); color: var(--fg-2); display: grid; place-items: center; flex: none; }
button.list-row[disabled] { cursor: default; opacity: 1; }
button.list-row[disabled]:hover { background: transparent; }

/* 켜고 끄는 스위치 (checkbox) */
.ad-switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 38px; height: 22px; margin: 0; border-radius: 999px; background: var(--line-strong); cursor: pointer; transition: background-color .15s ease; }
.ad-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); transition: transform .15s ease; }
.ad-switch:checked { background: var(--role); }
.ad-switch:checked::after { transform: translateX(16px); }
.ad-switch:disabled { opacity: .45; cursor: not-allowed; }
.ad-switch:focus-visible { outline: 2px solid var(--role); outline-offset: 2px; }

/* 정보 목록 */
.ad-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 0; }
.ad-kv-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ad-kv dt { font-size: 12px; color: var(--fg-3); }
.ad-kv dd { margin: 3px 0 0; font-size: 13.5px; min-width: 0; }
@media (max-width: 767px) { .ad-kv-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* 양식 */
.ad-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.ad-check-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--surface); transition: background-color .15s, border-color .15s; }
.ad-check-row:hover { background: var(--surface-2); }
.ad-check-row:has(input:checked) { border-color: var(--role-border); background: var(--role-muted); }
.ad-check-row input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--role); flex: none; }
.ad-pick-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
.ad-pick { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); cursor: pointer; min-width: 0; }
.ad-pick:first-child { border-top: 0; }
.ad-pick:hover { background: var(--surface-2); }
.ad-pick:has(input:checked) { background: var(--role-muted); }
.ad-pick input { width: 16px; height: 16px; margin: 0; accent-color: var(--role); flex: none; }
.ad-popform { padding: 14px 16px 16px; max-width: calc(100vw - 32px); }
.ad-danger-solid { background: var(--bad); color: var(--on-ink); border-color: transparent; font-weight: 600; }
.ad-danger-solid:hover { background: var(--bad); opacity: .9; }

/* 비용 줄 */
.ad-cost { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); }

/* 크레딧 요약 */
.ad-mini-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.ad-mini-stats > div { display: flex; flex-direction: column; gap: 2px; padding: 14px 20px; border-left: 1px solid var(--line); min-width: 0; }
.ad-mini-stats > div:first-child { border-left: 0; }
@media (max-width: 767px) {
  .ad-mini-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad-mini-stats > div:nth-child(3) { border-left: 0; }
  .ad-mini-stats > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.ad-delta { width: 34px; flex: none; text-align: right; font-size: 15px; }

/* 사용량 차트: 30일 막대를 촘촘하게, 날짜는 5일마다 */
.ad-chart .bars, .ad-chart .xlabels { gap: 3px; }
.ad-chart .bars .b { border-radius: 4px 4px 1px 1px; }
.ad-chart .xlabels span { overflow: visible; min-width: 0; }
.ad-chart .xlabels span:not(:nth-child(5n)) { visibility: hidden; }

/* 비용 비교에서 지금 쓰는 모델 */
.table tr.ad-hi td { background: var(--role-muted); }

/* 통계 카드 4개를 한 줄에 (보조 패널이 열린 1440px에서도) */
.ad-stats { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }
@media (max-width: 767px) {
  .ad-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ad-stats .stat-icon { display: none; }
  .ad-stats .stat-body { padding: 14px 14px 12px; gap: 4px; }
  .ad-stats .stat-label { font-size: 12.5px; }
  .ad-stats .stat-value { font-size: 25px; }
  .ad-stats .stat-foot { padding: 10px 14px; font-size: 12.5px; }
  .ad-home-side { order: -1; }
}

.boot { min-height: 100vh; display: grid; place-items: center; color: var(--fg-3); font-size: 14px; }

function studentStats(userId) {
  const subs = db.submissions.filter((s) => s.userId === userId);
  const scored = subs.filter((s) => s.status === 'scored').sort((a, b) => a.scoredAt - b.scoredAt);
  const areaAvg = {}; for (const a of AREAS) areaAvg[a.key] = scored.length ? Math.round(avg(scored.map((s) => s.evaluation.areas[a.key]))) : null;
  return {
    subs, scored,
    drafts: subs.filter((s) => s.status === 'draft'),
    pending: subs.filter((s) => s.status === 'waiting' || s.status === 'scoring'),
    avgTotal: scored.length ? Math.round(avg(scored.map((s) => s.evaluation.total))) : null,
    areaAvg,
    weakest: scored.length ? AREAS.slice().sort((a, b) => areaAvg[a.key] - areaAvg[b.key])[0] : null,
  };
}

  return html`<input class="input mono" style=${{ width: '74px', height: '34px', padding: '0 8px', fontSize: '13px' }} value=${txt} aria-label=${label} onInput=${(e) => setTxt(e.target.value)} onBlur=${() => { const v = parseTime(txt); if (v == null) setTxt(fmtTime(value)); else onChange(v); }} onKeyDown=${(e) => { if (e.key === 'Enter') e.target.blur(); }} />`;
}

// ── 항목 입력 (선생님, 학생 공통) ──────────────────────
// value: { text, hookType?, segments?, evidence?, keyPoints? }
function ItemEditor({ item, value, onChange, player, teacher, problems = [], compact, idPrefix = 'it' }) {
  const v = value || emptyAnswer(item);
  const set = (patch) => onChange({ ...v, ...patch });
  const dur = player && player.short ? player.short.durationSec : 60;
  const tNow = () => (player ? player.nowSec() : 0);
  const addEvidence = () => { const t = tNow(); const cap = player ? captionAt(player.short, t) : null; const evs = (v.evidence || []).filter((e) => e.t !== t); set({ evidence: [...evs, { t, label: cap ? cap[1] : '' }].sort((a, b) => a.t - b.t) }); };
  const segs = v.segments || [];
  const setSeg = (i, patch) => set({ segments: segs.map((s, j) => (j === i ? { ...s, ...patch } : s)).sort((a, b) => a.start - b.start) });
  const addSeg = () => {
    const names = ['도입', '전개', '결말', '반전', '마무리'];
    const t = segs.length ? Math.max(tNow(), Math.max(...segs.map((s) => s.start)) + 1) : 0;
    set({ segments: [...segs, { name: names[segs.length] || `구간 ${segs.length + 1}`, start: Math.min(t, dur - 1), text: '' }].sort((a, b) => a.start - b.start) });
  };
  const [kp, setKp] = useState('');
  const addKp = () => { const k = kp.trim(); if (!k) return; set({ keyPoints: [...(v.keyPoints || []), k] }); setKp(''); };
  const prob = (k) => problems.find((p) => p.msg.includes(k));
  const textId = `${idPrefix}-${item.key}-text`;
  return html`<div class="stack" style=${{ gap: compact ? '10px' : '14px' }}>
    ${item.kind === 'hook' && html`<div class="stack-sm">
      <span class="label">훅 유형</span>
      <div class="row-wrap" style=${{ gap: '6px' }} role="group" aria-label="훅 유형">${HOOK_TYPES.map((h) => html`<button type="button" class="chip" aria-pressed=${String(v.hookType === h)} onClick=${() => set({ hookType: v.hookType === h ? '' : h })}>${h}</button>`)}</div>
      ${prob('훅 유형') && html`<div class="error-text">${prob('훅 유형').msg}</div>`}
    </div>`}
    ${item.kind === 'segments' && html`<div class="stack-sm">
      <div class="row"><span class="label grow">구간 나누기</span><span class="tiny muted">전환 지점은 2초 안쪽이면 맞힌 것으로 봐요</span></div>
      <${SegBar} segments=${segs} duration=${dur} t=${player ? player.t : null} />
      <div class="stack-sm">${segs.map((s, i) => html`<div class="row" style=${{ gap: '6px', flexWrap: 'wrap' }}>
        <input class="input" style=${{ width: '72px', height: '34px', padding: '0 8px', fontSize: '13px' }} value=${s.name} aria-label="구간 이름" onInput=${(e) => setSeg(i, { name: e.target.value })} />
        <${TimeInput} value=${s.start} label="시작 시점" onChange=${(t) => setSeg(i, { start: clamp(t, 0, dur) })} />
        ${player && html`<button type="button" class="btn btn-sm" onClick=${() => setSeg(i, { start: tNow() })} title="지금 시점으로"><${Icon} name="timer" size="xs" />지금</button>`}
        <input class="input grow" style=${{ height: '34px', fontSize: '13px', flexBasis: '180px' }} value=${s.text} placeholder="이 구간이 하는 일" aria-label="구간 설명" onInput=${(e) => setSeg(i, { text: e.target.value })} />
        <button type="button" class="btn btn-ghost btn-icon btn-sm" onClick=${() => set({ segments: segs.filter((_, j) => j !== i) })} aria-label="구간 지우기"><${Icon} name="x" size="xs" /></button>
      </div>`)}</div>
      <div><button type="button" class="btn btn-sm" onClick=${addSeg}><${Icon} name="plus" size="xs" />${segs.length ? '지금 시점에서 구간 나누기' : '구간 추가'}</button></div>
      ${prob('구간') && html`<div class="error-text">${prob('구간').msg}</div>`}
    </div>`}
    <div class="field">
      <label class="label" for=${textId}>${item.kind === 'segments' ? '흐름 한 줄 요약 (선택)' : item.kind === 'hook' ? '어떻게 붙잡나요' : '내용'}</label>
      <textarea id=${textId} class="textarea" rows=${compact ? 2 : 3} value=${v.text || ''} placeholder=${item.help} aria-invalid=${prob('내용') ? 'true' : null} onInput=${(e) => set({ text: e.target.value })}></textarea>
      ${prob('내용') && html`<div class="error-text">${prob('내용').msg}</div>`}
    </div>
    ${item.evidence && html`<div class="stack-sm">
      <span class="label">근거 시점</span>
      <div class="row-wrap" style=${{ gap: '6px' }}>
        ${(v.evidence || []).map((e, i) => html`<${TimeTag} e=${e} onSeek=${player ? (t) => player.seekPlay(t) : null} onRemove=${() => set({ evidence: v.evidence.filter((_, j) => j !== i) })} />`)}
        ${player && html`<button type="button" class="btn btn-sm" onClick=${addEvidence}><${Icon} name="timer" size="xs" />지금 시점 넣기 <span class="mono muted">${fmtTime(player.t)}</span></button>`}
      </div>
      ${prob('근거') && html`<div class="error-text">${prob('근거').msg}</div>`}
    </div>`}
    ${teacher && html`<div class="stack-sm">
      <div class="row"><span class="label grow">채점 포인트</span><span class="tiny muted">학생 답에서 이 표현을 찾아 채점해요</span></div>
      <div class="row-wrap" style=${{ gap: '6px' }}>
        ${(v.keyPoints || []).map((k, i) => html`<span class="tag">${k}<button type="button" onClick=${() => set({ keyPoints: v.keyPoints.filter((_, j) => j !== i) })} aria-label=${k + ' 지우기'}><${Icon} name="x" size="xs" /></button></span>`)}
        <input class="input" style=${{ width: '200px', height: '30px', fontSize: '13px' }} value=${kp} placeholder="+ 포인트 추가 (Enter)" aria-label="채점 포인트 추가" onInput=${(e) => setKp(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); addKp(); } }} onBlur=${addKp} />
      </div>
      ${prob('채점 포인트') && html`<div class="error-text">${prob('채점 포인트').msg}</div>`}
    </div>`}
  </div>`;
}
// 읽기 전용 항목 내용 (결과, 검수, 정답지 보기)
function ItemView({ item, value, player, muted }) {
  const v = value || {};
  return html`<div class="stack-sm" style=${{ gap: '8px', color: muted ? 'var(--fg-2)' : null }}>
    ${item.kind === 'hook' && v.hookType && html`<div><span class="badge badge-role">${v.hookType}</span></div>`}
    ${v.text && html`<p style=${{ whiteSpace: 'pre-wrap' }}>${v.text}</p>`}
    ${item.kind === 'segments' && (v.segments || []).length > 0 && html`<div class="stack-sm">
      ${normSegments(v.segments, player && player.short ? player.short.durationSec : 60).map((s) => html`<div class="row-top small" style=${{ gap: '8px' }}><button type="button" class="tag tag-time" style=${{ border: 0, color: 'var(--role-strong)', fontWeight: 600 }} onClick=${() => player && player.seekPlay(s.start)}>${fmtTime(s.start)}</button><span class="strong" style=${{ flex: 'none' }}>${s.name}</span><span class="soft">${s.text || '-'}</span></div>`)}
    </div>`}
    ${(v.evidence || []).length > 0 && html`<div class="row-wrap" style=${{ gap: '6px' }}>${v.evidence.map((e) => html`<${TimeTag} e=${e} onSeek=${player ? (t) => player.seekPlay(t) : null} />`)}</div>`}
    ${!v.text && !(v.segments || []).length && !v.hookType && html`<p class="muted">비어 있어요</p>`}
  </div>`;
}

// ── 작업 카드 ───────────────────────────────────────
function jobOpenRoute(job) {
  const s = byId(db.shorts, job.shortId); if (!s) return null;
  if (job.kind === 'score') return { name: 'result', params: { shortId: s.id, submissionId: job.submissionId } };
  const u = me();
  if (job.kind === 'reference' && session.mode === 'student') {
    const sub = db.submissions.find((x) => x.userId === u.id && x.shortId === s.id && x.status === 'draft');
    return sub ? { name: 'write', params: { shortId: s.id, submissionId: sub.id } } : { name: 'learn', params: {} };
  }
  return u.roles.includes('teacher') ? { name: 'editor', params: { shortId: s.id } } : { name: 'learn', params: {} };
}
function JobCard({ job, t }) {
  const [why, setWhy] = useState(false);
  const short = byId(db.shorts, job.shortId);
  const p = jobProgress(job, t);
  const step = job.plan[p.stepIndex];
  let line;
  if (job.status === 'running') line = html`<div class="stack-sm" style=${{ gap: '5px' }}><div class="row small"><span class="grow ellipsis soft">${step.label}</span><span class="num muted">${p.pct}% · ${fmtMs(p.elapsed)}</span></div><${Progress} value=${p.pct} /></div>`;
  else if (job.status === 'queued') line = html`<div class="small soft">대기 중${queuePosition(job) ? ` · 앞에 ${queuePosition(job)}개` : ' · 곧 시작해요'}</div>`;
  else if (job.status === 'waiting') line = html`<div class="small soft">정답지가 준비되면 바로 채점해요</div>`;
  else if (job.status === 'done') line = html`<div class="small" style=${{ color: 'var(--ok)' }}><${Icon} name="check" size="xs" /> 끝났어요 · ${fmtMs((job.endedAt || t) - (job.startedAt || job.createdAt))}</div>`;
  else if (job.status === 'failed') line = html`<div class="small" style=${{ color: 'var(--bad)' }}>실패했어요${job.creditTxId ? ' · 크레딧 환불됨' : ''}</div>`;
  else line = html`<div class="small muted">취소했어요${job.creditTxId ? ' · 크레딧 환불됨' : ''}</div>`;
  const open = job.status === 'done' ? jobOpenRoute(job) : null;
  return html`<div class="job">
    <div class="row-top" style=${{ gap: '10px' }}>
      <${Thumb} short=${short} />
      <div class="grow stack-sm" style=${{ gap: '3px' }}>
        <div class="strong small ellipsis" title=${short ? short.title : ''}>${short ? short.title : '삭제된 쇼츠'}</div>
        <div class="tiny muted">${JOB_KIND_LABEL[job.kind]}${job.userId !== session.userId ? ' · 함께 받기' : ''}</div>
        ${line}
      </div>
    </div>
    ${(job.status === 'queued' || job.status === 'waiting' || open || job.status === 'failed') && html`<div class="row" style=${{ gap: '6px', justifyContent: 'flex-end' }}>
      ${(job.status === 'queued' || job.status === 'waiting') && job.userId === session.userId && html`<button type="button" class="btn btn-sm" onClick=${() => cancelJob(job.id)}>취소</button>`}
      ${job.status === 'failed' && html`<button type="button" class="btn btn-sm" onClick=${() => setWhy(!why)}>${why ? '접기' : '이유 보기'}</button>`}
      ${open && html`<button type="button" class="btn btn-sm btn-primary" onClick=${() => nav(open.name, open.params)}>열기</button>`}
    </div>`}
    ${why && html`<${Callout} tone="bad" icon="alert">${job.failReason}${job.creditTxId ? '. 쓴 크레딧은 돌려드렸어요.' : '.'}<//>`}
  </div>`;
}


// ===== shell.js =====
// ── 화면 틀: 아이콘 레일 | 헤더 + 콘텐츠 | 우측 패널 (스펙 0003, 0010) ──
const PAGES = {};           // 페이지 파일들이 여기에 등록합니다: PAGES[routeName] = Component
const WIDE_PAGES = new Set(['editor', 'write']);
const ui = { asideOpen: null, asideTab: 'jobs', railOpen: false, railExpanded: readLS('noonchy-proto:rail') !== false, doneFlash: null };
function setUi(patch) { Object.assign(ui, patch); emit(); }
function openJobs() { setUi({ asideOpen: true, asideTab: 'jobs' }); }

let theme = readLS(THEME_KEY) || 'system';
function applyTheme() { const el = document.documentElement; if (theme === 'system') delete el.dataset.theme; else el.dataset.theme = theme; }
function isDark() { if (theme !== 'system') return theme === 'dark'; try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch { return false; } }
function setTheme(v) { theme = v; writeLS(THEME_KEY, v); applyTheme(); emit(); }
function toggleTheme() { theme = isDark() ? 'light' : 'dark'; writeLS(THEME_KEY, theme); applyTheme(); emit(); }

function useDb() { const [, force] = useReducer((x) => x + 1, 0); useEffect(() => subscribe(force), []); return db; }

function App() {
  useDb();
  const u = me();
  let r = session.route || { name: 'login', params: {} };
  let def = ROUTES[r.name];
  if (!def) { r = { name: u ? homeRoute(u, session.mode) : 'login', params: {} }; def = ROUTES[r.name]; }
  if (!u && !def.public) { r = { name: 'login', params: {} }; def = ROUTES.login; }
  if (u && r.name === 'login') { r = { name: homeRoute(u, session.mode), params: {} }; def = ROUTES[r.name]; }
  if (u && def.mode && !u.roles.includes(def.mode)) { r = { name: homeRoute(u, session.mode), params: {} }; def = ROUTES[r.name]; }
  if (u && !u.roles.length && !['settings', 'no-access', 'invite'].includes(r.name)) { r = { name: 'no-access', params: {} }; def = ROUTES['no-access']; }
  if (u && def.credit && !usesCredits(u)) { r = { name: 'settings', params: {} }; def = ROUTES.settings; }
  if (u && r.name === 'no-access' && u.roles.length) { r = { name: homeRoute(u, session.mode), params: {} }; def = ROUTES[r.name]; }
  if (u && def.mode && session.mode !== def.mode) session.mode = def.mode;
  if (u && !session.mode && u.roles.length) session.mode = defaultMode(u);
  if (session.route.name !== r.name) { session.route = r; saveSession(); }
  const mode = u ? session.mode || '' : '';
  useEffect(() => { document.documentElement.dataset.mode = mode || ''; if (!mode) delete document.documentElement.dataset.mode; }, [mode]);
  useEffect(() => { try { document.title = `${def.title(r.params || {})} · noonchy`; } catch {} });
  const Page = PAGES[r.name] || (() => html`<${Empty} title="준비 중인 화면이에요" />`);
  if (def.public || r.name === 'no-access') return html`<div data-mode=${mode || null}><${ProtoBar} /><${Page} params=${r.params || {}} key=${r.name} /><${Toasts} /></div>`;
  return html`<${Shell} route=${r} def=${def} mode=${mode}><${Page} params=${r.params || {}} key=${r.name + JSON.stringify(r.params || {})} /><//>`;
}

function Shell({ route, def, mode, children }) {
  const wideScreen = useMedia('(min-width: 1280px)');
  const mobile = useMedia('(max-width: 767px)');
  const asideOpen = ui.asideOpen == null ? wideScreen && !WIDE_PAGES.has(route.name) : ui.asideOpen;
  const overlay = asideOpen && !wideScreen;
  useEffect(() => { if (ui.railOpen) setUi({ railOpen: false }); }, [route.name, JSON.stringify(route.params)]);
  return html`<div data-mode=${mode || null}>
    <div class="app">
      <${Rail} route=${route} mode=${mode} mobile=${mobile} />
      ${mobile && ui.railOpen && html`<div class="scrim" onClick=${() => setUi({ railOpen: false })}></div>`}
      <div class="main-col">
        <${ProtoBar} />
        <${Header} route=${route} def=${def} mobile=${mobile} asideOpen=${asideOpen} />
        <div class="body-row">
          <main class="content" id="main"><div class=${WIDE_PAGES.has(route.name) ? '' : 'content-narrow'} style=${WIDE_PAGES.has(route.name) ? { maxWidth: '1480px', margin: '0 auto' } : null}>${children}</div></main>
          ${asideOpen && html`<${Aside} route=${route} />`}
          ${overlay && html`<div class="scrim" style=${{ zIndex: 58 }} onClick=${() => setUi({ asideOpen: false })}></div>`}
        </div>
      </div>
    </div>
    <${Toasts} />
  </div>`;
}

function ProtoBar() {
  const [ask, setAsk] = useState(false);
  const u = me();
  return html`<div class="proto-bar">
    <span><b>프로토타입</b> · 서버 없이 이 브라우저에만 저장돼요</span>
    ${u && html`<span class="mono" style=${{ opacity: 0.75 }}>${routePath()}</span>`}
    <button type="button" onClick=${() => setAsk(true)}>처음 상태로 되돌리기</button>
    ${ask && html`<${Modal} title="처음 상태로 되돌릴까요?" onClose=${() => setAsk(false)} foot=${html`<button class="btn" onClick=${() => setAsk(false)}>그대로 두기</button><button class="btn btn-dark" onClick=${() => { setAsk(false); resetAll(); }}>되돌리기</button>`}>
      <p class="soft">이 브라우저에서 바꾼 모든 내용(작성한 분석, 등록한 쇼츠, 크레딧, 초대)이 지워지고 예시 데이터로 다시 채워져요. 로그인은 그대로예요.</p>
    <//>`}
  </div>`;
}

function Rail({ route, mode, mobile }) {
  const items = NAV[mode] || [];
  const def = ROUTES[route.name] || {};
  const expanded = mobile || ui.railExpanded;
  const groups = []; for (const it of items) { const g = groups[groups.length - 1]; if (g && g[0].group === it.group) g.push(it); else groups.push([it]); }
  const go = (name) => nav(name);
  return html`<nav class=${'rail' + (expanded ? ' expanded' : '') + (ui.railOpen ? ' open' : '')} aria-label="메뉴">
    <div class="rail-logo"><span class="logo-mark"><${Icon} name="logo" /></span><span class="logo-word">noonchy</span>${mobile && html`<span class="spacer"></span><button class="btn btn-ghost btn-icon btn-sm" onClick=${() => setUi({ railOpen: false })} aria-label="메뉴 닫기"><${Icon} name="x" size="sm" /></button>`}</div>
    ${groups.map((g, gi) => html`${gi > 0 && html`<div class="rail-sep"></div>`}${g.map((it) => html`<button type="button" class="rail-item" aria-current=${def.menu === it.route ? 'page' : null} onClick=${() => go(it.route)} title=${expanded ? null : it.label}><${Icon} name=${it.icon} /><span class="label">${it.label}</span></button>`)}`)}
    <span class="spacer"></span>
    <button type="button" class="rail-item" aria-current=${route.name === 'settings' || route.name === 'credits' ? 'page' : null} onClick=${() => go('settings')} title=${expanded ? null : '설정'}><${Icon} name="settings" /><span class="label">설정</span></button>
    ${!mobile && html`<button type="button" class="rail-item" onClick=${() => { const v = !ui.railExpanded; writeLS('noonchy-proto:rail', v); setUi({ railExpanded: v }); }} title=${expanded ? null : '메뉴 펼치기'} aria-label=${expanded ? '메뉴 접기' : '메뉴 펼치기'}><${Icon} name=${expanded ? 'chevL' : 'chevR'} /><span class="label">접기</span></button>`}
  </nav>`;
}

function Header({ route, def, mobile, asideOpen }) {
  const u = me();
  const [bell, setBell] = useState(false);
  const [prof, setProf] = useState(false);
  const mine = jobsFor(u.id);
  const active = mine.filter(isActive);
  const notes = notificationsFor(u.id);
  const unread = notes.filter((n) => !n.read).length;
  const title = def.title(route.params || {});
  return html`<header class="header">
    ${mobile && html`<button class="btn btn-ghost btn-icon" onClick=${() => setUi({ railOpen: true })} aria-label="메뉴 열기"><${Icon} name="menu" /></button>`}
    <div class="header-title grow">
      ${def.crumb ? html`<button type="button" class="crumb" style=${{ border: 0, background: 'none', padding: 0, textAlign: 'left', cursor: 'pointer' }} onClick=${() => nav(ROUTES[route.name].menu)}>← ${def.crumb}</button>` : html`<span class="crumb">${ROLE_LABEL[session.mode] || ''}${session.mode ? ' 모드' : ''}</span>`}
      <h1 class="ellipsis">${title}</h1>
    </div>
    <${Island} jobs=${active} mobile=${mobile} />
    ${usesCredits(u) && html`<button type="button" class="credit-badge" onClick=${() => nav('credits')} aria-label=${`크레딧 ${balanceOf(u.id)}개, 내 크레딧 보기`} title="내 크레딧"><${Icon} name="coins" size="sm" /><${RollingNumber} value=${balanceOf(u.id)} /></button>`}
    <span style=${{ position: 'relative' }}><button type="button" class="btn btn-ghost btn-icon" onClick=${() => setUi({ asideOpen: !(asideOpen && ui.asideTab === 'jobs'), asideTab: 'jobs' })} aria-label=${`작업 ${active.length}개 진행 중`} title="작업"><${Icon} name="tasks" /></button>${active.length > 0 && html`<span class="count-badge">${active.length}</span>`}</span>
    ${!mobile && html`<button type="button" class="btn btn-ghost btn-icon" onClick=${toggleTheme} aria-label=${isDark() ? '밝은 화면으로' : '어두운 화면으로'} title="화면 밝기"><${Icon} name=${isDark() ? 'sun' : 'moon'} /></button>`}
    <span style=${{ position: 'relative' }}>
      <button type="button" class="btn btn-ghost btn-icon" onMouseDown=${(e) => e.stopPropagation()} onTouchStart=${(e) => e.stopPropagation()} onClick=${() => setBell(!bell)} aria-label=${`알림 ${unread}개 안 읽음`} aria-expanded=${String(bell)} title="알림"><${Icon} name="bell" /></button>
      ${unread > 0 && html`<span class="count-badge">${unread}</span>`}

// 작업 섬: 진행 중인 작업이 있을 때만 보입니다. 끝나면 잠깐 "준비됨 ✓"
function Island({ jobs, mobile }) {
  const t = useNow(500, jobs.length > 0);
  const u = me();
  const recentDone = jobsFor(u.id).filter((j) => j.status === 'done' && j.endedAt && now() - j.endedAt < 3500)[0];
  useNow(700, !!recentDone);
  if (!jobs.length && !recentDone) return null;
  if (!jobs.length) {
    const label = recentDone.kind === 'score' ? '채점 끝남' : recentDone.kind === 'ingest' ? '쇼츠 가져옴' : '정답지 준비됨';
    return html`<button type="button" class="island done" onClick=${openJobs} aria-label=${label} style=${mobile ? { padding: '0 10px' } : null}><span class="pulse"></span>${!mobile && html`<span class="ellipsis">${label}</span>`}<${Icon} name="check" size="xs" /></button>`;
  }
  const running = jobs.filter((j) => j.status === 'running');
  const pct = running.length ? Math.round(avg(running.map((j) => jobProgress(j, t).pct))) : 0;
  const label = mobile ? `${jobs.length}` : `분석 ${jobs.length}개 진행 중${running.length ? ` · ${pct}%` : ' · 대기'}`;
  return html`<button type="button" class="island" onClick=${openJobs} aria-label=${`작업 ${jobs.length}개 진행 중, 작업 목록 열기`} style=${mobile ? { padding: '0 11px 0 10px' } : null}><span class="pulse"></span><span class="ellipsis">${label}</span></button>`;
}

        ${done.length > 0 && html`<div class="tiny muted strong" style=${{ marginTop: '6px' }}>끝난 작업</div>${done.map((j) => html`<${JobCard} job=${j} t=${t} key=${j.id} />`)}`}
        <div class="tiny muted" style=${{ padding: '4px 2px' }}>작업은 서버에서 돌기 때문에 페이지를 닫거나 다른 메뉴로 가도 멈추지 않아요. 프로토타입에서는 이 브라우저가 서버 역할을 해요.</div>

// 어시스턴트: 프로토타입에서는 준비된 질문에 답합니다
const ASSIST_QA = [
  { q: '크레딧은 언제 써요?', k: ['크레딧', '돈', '비용', '결제'], a: 'DB에 없는 새 쇼츠의 정답지를 만들 때만 써요. 시작한 1분마다 1크레딧이고, 이미 정답지가 있는 쇼츠는 무료예요. 실패하거나 대기 중에 취소하면 돌려드려요. 선생님과 관리자는 무료예요.' },
  { q: '근거 시점은 왜 남겨요?', k: ['근거', '시점', '타임', '시간'], a: '채점할 때 정답지의 시점과 2초 안쪽이면 맞힌 것으로 봐요. 영상을 보다가 "지금 시점 넣기"를 누르면 그 순간의 자막까지 같이 들어가요.' },
  { q: '채점은 어떻게 해요?', k: ['채점', '점수', '평가'], a: '항목마다 정답지의 채점 포인트를 얼마나 짚었는지, 훅 유형이 같은지, 근거 시점이 맞는지를 봐요. 10개 항목 점수를 5개 역량 영역(훅 설계, 타깃 이해, 구조화, 편집 감각, 기획 통찰)으로 묶어 보여 드려요.' },
  { q: '정답지는 언제 볼 수 있어요?', k: ['정답지', '정답', '보기'], a: '내 분석을 제출하고 채점을 받은 뒤에 결과 화면의 "정답지" 탭에서 볼 수 있어요. 먼저 스스로 분석해 봐야 연습이 되니까요.' },
  { q: '정답지를 기다려야 해요?', k: ['기다', '대기', '오래'], a: '아니요. 정답지가 만들어지는 동안에도 바로 분석을 쓸 수 있어요. 먼저 제출하면 정답지가 준비되는 대로 채점해서 알려 드려요.' },
  { q: 'AI 초안은 어떻게 검수해요?', k: ['ai', '초안', '검수', '모델'], a: '항목마다 수락, 고치기, 거절 중 하나를 고르면 돼요. 10개 항목을 모두 수락하거나 고치면 선생님 정답지로 게시할 수 있어요. 확신이 낮은 항목에는 표시가 붙어요.' },
  { q: '초대 링크는 어떻게 만들어요?', k: ['초대', '링크', '코호트'], a: '관리자 모드의 코호트 상세에서 이메일을 넣으면 사람마다 다른 링크가 만들어지고, 정해 둔 날이 지나면 만료돼요. 링크는 한 번만 쓸 수 있어요.' },
];
function Assistant({ route }) {
  const [log, setLog] = useState([]);
  const [q, setQ] = useState('');
  const ask = (text) => {
    const t = text.trim(); if (!t) return;
    const hit = ASSIST_QA.find((x) => x.q === t) || ASSIST_QA.find((x) => x.k.some((k) => t.toLowerCase().includes(k)));
    setLog((l) => [...l, { me: true, text: t }, { me: false, text: hit ? hit.a : '프로토타입이라 아래 질문들에만 답할 수 있어요. 비슷한 질문을 골라 보세요.' }]);
    setQ('');
  };
  const order = { write: [1, 4, 0], result: [2, 3], learn: [0, 4], editor: [5, 1], dataset: [5], cohort: [6], cohorts: [6] }[route.name] || [0, 2, 3];
  const sugg = [...order.map((i) => ASSIST_QA[i]), ...ASSIST_QA.filter((_, i) => !order.includes(i))].slice(0, 5);
  return html`<div class="stack" style=${{ gap: '10px' }}>
    <div class="callout neutral"><${Icon} name="chat" size="sm" /><div>이 화면에서 자주 묻는 질문이에요. 궁금한 걸 골라 보세요.</div></div>
    ${log.map((m) => html`<div style=${{ alignSelf: m.me ? 'flex-end' : 'flex-start', maxWidth: '90%', padding: '9px 12px', borderRadius: '14px', fontSize: '13.5px', background: m.me ? 'var(--role)' : 'var(--surface)', color: m.me ? 'var(--role-fg)' : 'var(--fg)', border: m.me ? 0 : '1px solid var(--line)' }}>${m.text}</div>`)}
    <div class="stack-sm">${sugg.map((x) => html`<button type="button" class="btn btn-sm" style=${{ justifyContent: 'flex-start', height: 'auto', minHeight: '32px', padding: '6px 11px', whiteSpace: 'normal', textAlign: 'left' }} onClick=${() => ask(x.q)}>${x.q}</button>`)}</div>
    <form class="row" style=${{ gap: '6px' }} onSubmit=${(e) => { e.preventDefault(); ask(q); }}><input class="input" value=${q} onInput=${(e) => setQ(e.target.value)} placeholder="질문하기" aria-label="어시스턴트에게 질문" /><button class="btn btn-primary btn-icon" aria-label="보내기"><${Icon} name="send" size="sm" /></button></form>
  </div>`;
}

function Toasts() {
  return html`<div class="toasts" aria-live="polite">${toasts.map((t) => html`<div class="toast" key=${t.id}>
    <${Icon} name=${t.tone === 'bad' ? 'alert' : 'check'} size="sm" />
    <div class="grow stack-sm" style=${{ gap: '2px' }}><span class="strong">${t.title}</span>${t.body && html`<span style=${{ opacity: 0.8, fontSize: '12.5px' }}>${t.body}</span>`}</div>
    ${t.action && html`<button class="btn" onClick=${() => { dismissToast(t.id); nav(t.action.route.name, t.action.route.params); }}>${t.action.label}</button>`}
    <button class="btn btn-icon" style=${{ width: '28px', border: 0 }} onClick=${() => dismissToast(t.id)} aria-label="닫기"><${Icon} name="x" size="xs" /></button>
  </div>`)}</div>`;
}

// ── 도우미 ─────────────────────────────────────────
const ST_CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩';
function stAreaName(key) { const a = AREAS.find((x) => x.key === key); return a ? a.name : ''; }
function stScoreCls(v) { return v >= 75 ? 'badge-ok' : v >= 50 ? 'badge-role' : 'badge-bad'; }
function stGradeShort(v) { return v >= 85 ? '아주 좋아요' : v >= 70 ? '좋아요' : v >= 50 ? '보통이에요' : '더 연습해요'; }
const ST_MAC = typeof navigator !== 'undefined' && /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
function stGrade(v) { return v >= 85 ? '아주 잘했어요' : v >= 70 ? '잘했어요' : v >= 50 ? '조금만 더 연습해요' : '다시 도전해 봐요'; }
function stWeakest(areas) { return AREAS.slice().sort((a, b) => areas[a.key] - areas[b.key])[0]; }
function stMySubs(userId) { return db.submissions.filter((s) => s.userId === userId).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); }
function stAttempt(sub) {
  const list = db.submissions.filter((s) => s.userId === sub.userId && s.shortId === sub.shortId).sort((a, b) => a.createdAt - b.createdAt);
  return { n: list.findIndex((s) => s.id === sub.id) + 1, total: list.length };
}
function stCat(sub) { return sub.status === 'draft' ? 'draft' : sub.status === 'scored' ? 'scored' : 'pending'; }
function stOpen(sub) { nav(sub.status === 'draft' ? 'write' : 'result', { shortId: sub.shortId, submissionId: sub.id }); }
function stScoreJob(sub) { return db.jobs.find((j) => j.kind === 'score' && j.submissionId === sub.id && isActive(j)) || null; }
function stFreeReason(u) { return `${u.roles.includes('teacher') ? '선생님' : '관리자'} 롤이 있어서 무료예요`; }

// 쇼츠의 정답지 상태: 만드는 중 / 대기 / 준비됨 / 실패 / 취소 / 없음
function stRefState(short, userId) {
  if (!short) return { key: 'none' };
  const job = activeJobFor(short.id, 'reference');
  if (job) return { key: job.status === 'running' ? 'running' : 'queued', job };
  if (keyFor(short.id)) return { key: 'ready' };
  const last = db.jobs.find((j) => j.shortId === short.id && j.kind === 'reference' && (j.status === 'failed' || j.status === 'canceled'));
  const refunded = !!(last && last.creditTxId && last.userId === userId && db.credits.some((c) => c.refundOf === last.creditTxId));
  if (short.status === 'failed' || (last && last.status === 'failed')) return { key: 'failed', reason: short.failReason || (last && last.failReason) || '정답지를 만들지 못했어요', refunded, job: last };
  if (last) return { key: 'canceled', reason: '정답지 만들기를 취소했어요', refunded, job: last };
  return { key: 'none' };
}

// 항목이 완전히 비었는지 (채점에서 0점이 되는 경우)
function stIsEmpty(item, v) {
  if (!v) return true;
  const txt = [v.text, ...(v.segments || []).map((s) => s.text), ...(v.evidence || []).map((e) => e.label)].join('').trim();
  return !txt && !v.hookType;
}
function stMissingNote(item, v) {
  v = v || {};
  if (item.kind === 'hook') return !v.hookType ? '훅 유형을 골라 주세요' : '어떻게 붙잡는지 적어 주세요';
  if (item.kind === 'segments') return '구간을 2개 이상 나누고 설명을 적어 주세요';
  return '내용을 적어 주세요';
}
function stAnswerLine(item, v) {
  v = v || {};
  if (item.kind === 'segments' && (v.segments || []).length) return v.segments.map((s) => s.name).join(' → ') + (v.text ? ' · ' + v.text : '');
  return [item.kind === 'hook' ? v.hookType : '', v.text].filter(Boolean).join(' · ');
}

// 링크 확인: checkLink + 같은 링크 두 번 막기
function stCheckAll(lines) {
  const seen = new Set();
  return lines.map((raw) => {
    const c = checkLink(raw);
    if (!c.videoId) return c;
    if (seen.has(c.videoId)) return { ...c, kind: 'dup', cost: 0, error: '같은 링크가 두 번 있어요' };
    seen.add(c.videoId); return c;
  });
}
function stCheckInfo(c, u) {
  const paid = usesCredits(u);
  if (c.kind === 'hit') return { tone: 'ok', text: 'DB에 있음 · 무료', cost: '무료' };
  if (c.kind === 'running') {
    const j = activeJobFor(c.short.id, 'reference');
    const mine = j && (j.userId === u.id || (j.watchers || []).includes(u.id));
    return { tone: 'role', text: mine ? '이미 분석 중이에요 · 이어서 쓸 수 있어요' : '다른 사람이 분석 중 · 무료, 끝나면 같이 받아요', cost: '무료' };
  }
  if (c.kind === 'new') return { tone: 'role', text: `DB에 없는 쇼츠예요 · ${paid ? c.cost + '크레딧' : '무료'}`, cost: paid ? `${c.cost}크레딧` : '무료' };
  if (c.kind === 'too-long') return { tone: 'bad', text: '3분이 넘어서 분석할 수 없어요', cost: '–' };
  if (c.kind === 'dup') return { tone: 'bad', text: '같은 링크가 두 번 있어요', cost: '–' };
  return { tone: 'bad', text: '쇼츠 링크가 아니에요', cost: '–' };
}
// 예시 링크: 아직 DB에 없는 새 쇼츠를 고릅니다 (한 번 쓰면 DB에 들어가 무료가 되니까요)
function stFreshLinks(n) {

}
const ST_SAMPLES = [
  { key: 'hit', label: 'DB에 있는 쇼츠', links: () => [SAMPLE_LINKS.hit] },
  { key: 'new', label: '새 쇼츠', links: () => stFreshLinks(1) },

];

function useStWidth(ref) {
  const [w, setW] = useState(0);
  useEffect(() => {
    const el = ref.current; if (!el || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver((es) => setW(Math.round(es[0].contentRect.width)));
    ro.observe(el); return () => ro.disconnect();
  }, []);
  return w;
}

// Modal과 같은 모양이지만 role(alertdialog)과 모바일 시트를 고를 수 있어요
function StDialog({ title, sub, onClose, children, foot, wide, role = 'dialog', sheet, cls = '' }) {
  const ref = useRef();
  const closeRef = useRef(onClose); closeRef.current = onClose;
  const titleId = useMemo(() => uid('st-dlg'), []);
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape' && closeRef.current) closeRef.current(); };
    document.addEventListener('keydown', k);
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', k); document.body.style.overflow = prev; };
  }, []);
  useEffect(() => { const r = ref.current; const el = r && (r.querySelector('.modal-foot .btn-primary:not([disabled])') || r.querySelector('.modal-foot .btn')); if (el) el.focus(); }, []);
  return html`<div class=${'modal-wrap' + (sheet ? ' st-sheet-wrap' : '')} onMouseDown=${(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
    <div class=${'modal' + (wide ? ' wide' : '') + (sheet ? ' st-sheet' : '') + (cls ? ' ' + cls : '')} role=${role} aria-modal="true" aria-labelledby=${titleId} ref=${ref}>
      ${sheet && html`<span class="st-sheet-handle" aria-hidden="true"></span>`}
      <div class="modal-head"><div class="grow"><h2 id=${titleId}>${title}</h2>${sub && html`<div class="small muted" style=${{ marginTop: '2px' }}>${sub}</div>`}</div>${onClose && html`<button type="button" class="btn btn-ghost btn-icon btn-sm" onClick=${onClose} aria-label="닫기"><${Icon} name="x" size="sm" /></button>`}</div>
      <div class="modal-body">${children}</div>
      ${foot && html`<div class="modal-foot">${foot}</div>`}
    </div>
  </div>`;
}

  const st = stRefState(short, session.userId);
  if (st.key === 'running') { const p = jobProgress(st.job, t); return html`<span class="badge badge-dashed st-ref-badge" title=${st.job.plan[p.stepIndex].label}><span class="st-pulse"></span>정답지 준비 중 · <span class="num">${p.pct}%</span></span>`; }
  if (st.key === 'queued') return html`<span class="badge badge-dashed st-ref-badge"><span class="st-pulse"></span>정답지 대기 중</span>`;
  if (st.key === 'ready') return html`<span class="badge badge-ok"><${Icon} name="check" size="xs" />정답지 준비됨</span>`;
  if (st.key === 'failed') return html`<span class="badge badge-bad"><${Icon} name="alert" size="xs" />정답지를 만들지 못했어요</span>`;
  return html`<span class="badge badge-outline">정답지 없음</span>`;
}

// 링크 확인 창 (스펙 0008 흐름): 링크마다 상태, 합계, 잔액
function StStartConfirm({ checks, onClose, onStarted }) {
  const u = me();
  const paid = usesCredits(u);
  const valid = checks.filter((c) => ['hit', 'running', 'new'].includes(c.kind));
  const fresh = checks.filter((c) => c.kind === 'new');
  const total = paid ? sum(fresh.map((c) => c.cost)) : 0;
  const bal = paid ? balanceOf(u.id) : 0;
  const lacking = paid && total > bal;
  const [err, setErr] = useState('');
  const canStart = valid.length > 0 && !lacking;
  const start = () => {
    if (!canStart) return;
    const r = startLearning(valid);
    if (!r.ok) { setErr(r.error); return; }
    onStarted(r.submissions);
  };
  const subLine = checks.length === 1 ? '링크 1개를 확인했어요'
    : `${checks.length}개 중 ${fresh.length ? `${fresh.length}개가 DB에 없어요` : '새 쇼츠는 없어요'}${paid && total ? ` · ${total}크레딧` : ''}`;
  const label = paid && total > 0 ? `${total}크레딧 쓰고 시작` : valid.length > 1 ? `${valid.length}개 시작` : '시작';
  return html`<${StDialog} role="alertdialog" title=${fresh.length ? '새 쇼츠를 분석할까요?' : '분석을 시작할까요?'} sub=${subLine} onClose=${onClose} foot=${html`
      <button type="button" class="btn" onClick=${onClose}>${valid.length ? '취소' : '링크 고치기'}</button>
      <button type="button" class="btn btn-primary" disabled=${!canStart} onClick=${start}>${label}</button>`}>
    <div class="st-checks">${checks.map((c, i) => html`<${StCheckRow} c=${c} u=${u} key=${i} />`)}</div>
    ${fresh.length > 0 && html`<${Callout} icon="clock">정답지는 30~60초쯤 걸려요. 기다리는 동안 분석을 먼저 써도 돼요.<//>`}
    ${valid.length > 0 && (paid ? html`<dl class="st-sum">
        <dt>쓸 크레딧</dt><dd>${total ? `${total}크레딧` : '무료'}</dd>
        <dt>잔액</dt><dd>${bal}${total && !lacking ? html` → ${bal - total}` : ''}크레딧</dd>
        ${lacking && html`<dt class="st-tone-bad">모자라는 크레딧</dt><dd class="st-tone-bad">${total - bal}크레딧</dd>`}
      </dl>` : html`<${Callout} tone="ok" icon="check">${stFreeReason(u)}. 새 쇼츠도 크레딧을 쓰지 않아요.<//>`)}
    ${lacking && html`<${Callout} tone="bad" icon="alert"><b>크레딧이 부족해요.</b> ${total}크레딧이 필요한데 ${bal}크레딧 남았어요. DB에 있는 쇼츠는 무료로 분석할 수 있어요. 크레딧은 선생님이나 관리자에게 문의해 주세요.<//>`}
    ${!valid.length && html`<${Callout} tone="bad" icon="alert">시작할 수 있는 링크가 없어요. 유튜브 쇼츠 링크인지, 3분 안쪽 영상인지 확인해 주세요.<//>`}
    ${err && html`<div class="error-text">${err}</div>`}
  <//>`;
}

// 추이 차트 (LineChart와 같은 모양, 실제 너비로 그려 글자 크기가 일정하고 끝 날짜가 잘리지 않게)
function StLineChart({ labels, series, height = 220, focus, onFocus, max = 100, W = 340 }) {
  const H = height, pl = 28, pr = 10, pt = 12, pb = 26;
  const n = labels.length;
  const x = (i) => (n <= 1 ? (pl + W - pr) / 2 : pl + (i * (W - pl - pr)) / (n - 1));
  const y = (v) => pt + (1 - v / max) * (H - pt - pb);
  const path = (vals) => vals.map((v, i) => (v == null ? null : `${i === 0 || vals[i - 1] == null ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`)).filter(Boolean).join(' ');
  const every = Math.max(1, Math.ceil(n / 5));
  const ordered = series.slice().sort((a, b) => (a.key === focus) - (b.key === focus));
  return html`<div class="stack-sm">
    <div class="row-wrap" style=${{ gap: '6px' }}>
      ${series.map((s) => html`<button type="button" class="chip" aria-pressed=${String(s.key === focus)} onClick=${() => onFocus && onFocus(s.key === focus ? null : s.key)} style=${{ height: '28px', fontSize: '12.5px' }}><span class="dot" style=${{ background: s.key === focus ? 'var(--role)' : 'var(--fg-3)' }}></span>${s.name}</button>`)}
    </div>
    <svg viewBox=${`0 0 ${W} ${H}`} style=${{ width: '100%', height: 'auto', display: 'block' }} role="img" aria-label="영역별 점수 추이">
      ${[0, 25, 50, 75, 100].map((g) => html`<g><line x1=${pl} x2=${W - pr} y1=${y(g)} y2=${y(g)} stroke="var(--line)" stroke-dasharray=${g ? '3 4' : ''} /><text x=${pl - 6} y=${y(g) + 4} text-anchor="end" font-size="10.5" fill="var(--fg-3)">${g}</text></g>`)}
      ${labels.map((l, i) => (i === n - 1 || (i % every === 0 && n - 1 - i >= Math.ceil(every / 2))) && html`<text x=${x(i)} y=${H - 6} text-anchor=${n > 1 && i === n - 1 ? 'end' : n > 1 && i === 0 ? 'start' : 'middle'} font-size="11" fill="var(--fg-3)">${l}</text>`)}
      ${ordered.map((s) => { const on = s.key === focus || !focus; const hi = s.key === focus; return html`<g>
        <path d=${path(s.values)} fill="none" stroke=${hi ? 'var(--role)' : 'var(--fg-3)'} stroke-width=${hi ? 2.6 : 1.4} opacity=${on ? (hi ? 1 : 0.55) : 0.18} stroke-linejoin="round" stroke-linecap="round" />
        ${s.values.map((v, i) => v != null && html`<circle cx=${x(i)} cy=${y(v)} r=${hi ? 3.6 : 2.4} fill=${hi ? 'var(--role)' : 'var(--fg-3)'} opacity=${on ? (hi ? 1 : 0.55) : 0.18}><title>${s.name} ${v}</title></circle>`)}
      </g>`; })}
    </svg>
  </div>`;
}
function StTrendChart({ scored, focus, onFocus }) {
  const ref = useRef();
  const w = useStWidth(ref);
  const labels = scored.map((s) => fmtDate(s.scoredAt));
  const series = AREAS.map((a) => ({ key: a.key, name: a.name, values: scored.map((s) => s.evaluation.areas[a.key]) }));
  return html`<div ref=${ref} style=${{ minWidth: 0 }}>
    ${w === 0 ? html`<${LineChart} labels=${labels} series=${series} focus=${focus} onFocus=${onFocus} height=${220} />` : html`<${StLineChart} labels=${labels} series=${series} focus=${focus} onFocus=${onFocus} W=${w} height=${w >= 560 ? 240 : 220} />`}
  </div>`;
}

function StSubRow({ sub, t, onPreview, onRestart }) {
  const short = byId(db.shorts, sub.shortId);
  if (!short) return null;
  const ref = stRefState(short, sub.userId);
  const at = stAttempt(sub);
  const draft = sub.status === 'draft';
  const broken = draft && (ref.key === 'failed' || ref.key === 'canceled');
  const preparing = (draft || sub.status === 'waiting') && (ref.key === 'running' || ref.key === 'queued');
  const sj = sub.status === 'scoring' ? stScoreJob(sub) : null;
  let status;
  if (broken) {
    status = html`<span class="badge badge-bad"><${Icon} name="alert" size="xs" />${ref.key === 'failed' ? '분석 실패' : '분석 취소'}</span><span class="small st-tone-bad">${ref.reason}</span>${ref.refunded && html`<span class="badge badge-outline"><${Icon} name="refresh" size="xs" />크레딧 환불됨</span>`}`;
  } else if (preparing) {
    const p = ref.key === 'running' ? jobProgress(ref.job, t) : null;
    status = html`<${SubmissionBadge} sub=${sub} /><span class="st-prep"><span class="st-pulse"></span><span class="small soft">${p ? '정답지 준비 중' : '정답지 대기 중'}</span>${p && html`<${Progress} value=${p.pct} style=${{ width: '72px' }} /><span class="tiny muted num">${p.pct}%</span>`}</span>`;
  } else if (sj) {
    const p = sj.status === 'running' ? jobProgress(sj, t) : null;
    status = html`<span class="badge badge-role">채점 중</span>${p ? html`<span class="st-prep"><${Progress} value=${p.pct} style=${{ width: '72px' }} /><span class="tiny muted num">${p.pct}%</span></span>` : html`<span class="tiny muted">곧 채점해요</span>`}`;
  } else if (sub.status === 'scored') {
    status = html`<span class=${'badge ' + stScoreCls(sub.evaluation.total)}>${sub.evaluation.total}점</span><span class="tiny muted">${stGrade(sub.evaluation.total)}</span>`;
  } else status = html`<${SubmissionBadge} sub=${sub} />`;
  const when = sub.status === 'scored' ? sub.scoredAt : !draft && sub.submittedAt ? sub.submittedAt : sub.updatedAt;
  const remove = () => { deleteDraft(sub.id); toast({ title: '지웠어요', body: short.title }); };
  return html`<div class="st-row">
    <${Thumb} short=${short} onClick=${() => onPreview(short)} />
    <div class="st-row-main">
      <div class="row" style=${{ gap: '8px' }}>
        ${broken ? html`<span class="st-row-title ellipsis">${short.title}</span>` : html`<button type="button" class="st-row-title ellipsis" onClick=${() => stOpen(sub)}>${short.title}</button>`}

      </div>

      <div class="st-row-status">${status}</div>
    </div>
    <div class="st-row-side">
      <span class="tiny muted" title=${fmtDateTime(when)}>${fmtRel(when)}</span>
      <div class="row" style=${{ gap: '6px' }}>
        ${broken ? html`${ref.key === 'canceled' && html`<button type="button" class="btn btn-sm" onClick=${() => onRestart(short)}>다시 시작</button>`}<button type="button" class="btn btn-sm btn-danger" onClick=${remove}><${Icon} name="trash" size="xs" />지우기</button>`
          : html`<button type="button" class=${'btn btn-sm' + (draft ? ' btn-primary' : '')} onClick=${() => stOpen(sub)}>${draft ? '이어서 쓰기' : sub.status === 'scored' ? '결과 보기' : '보기'}</button>`}

function stResolveSub(u, params) {
  if (!u || !byId(db.shorts, params.shortId)) return null;
  if (params.submissionId) { const s = byId(db.submissions, params.submissionId); return s && s.userId === u.id ? s.id : null; }
  const d = db.submissions.find((s) => s.userId === u.id && s.shortId === params.shortId && s.status === 'draft');
  if (d) return d.id;
  const created = ensureDraft(u.id, params.shortId); // 화면을 그리는 중이라 조용히 저장합니다
  writeLS(STORE_KEY, db);
  return created.id;
}

  const [step, setStep] = useState(() => (sub ? clamp(sub.step || 0, 0, RUBRIC.length - 1) : 0));
  const [savedAt, setSavedAt] = useState(() => (sub ? sub.updatedAt : now()));
  const [ask, setAsk] = useState(false);

  useNow(15000);
  const editable = !!sub && sub.status === 'draft';
  const blocked = ['failed', 'canceled', 'none'].includes(ref.key);
  const last = step === RUBRIC.length - 1;
  const go = (i) => {
    const s = clamp(i, 0, RUBRIC.length - 1); if (s === step) return;
    setStep(s); if (editable) saveAnswers(sub.id, answers, s, true);
    const el = cardRef.current;

    const k = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); keyRef.current(); } };

  published: (k) => k === 'published',

// 홈에서 목록으로 갈 때 필터나 "쇼츠 추가" 패널을 미리 정해 둡니다 (한 번 쓰고 비웁니다)
let teDatasetPreset = null;
function teGoDataset(preset) { teDatasetPreset = preset || null; nav('dataset'); }

const teName = (id) => (byId(db.users, id) || {}).name || '알 수 없음';
const teDur = (sec) => `${Math.floor((sec || 0) / 60)}:${pad2(Math.floor((sec || 0) % 60))}`;
const teAreaName = (key) => (AREAS.find((a) => a.key === key) || {}).name || '';
function teRandomId() { const al = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; let s = 'T'; for (let i = 0; i < 10; i++) s += al[Math.floor(Math.random() * al.length)]; return s; }
function teOwnerId(short) { const r = teacherRefOf(short.id); return r ? r.authorId : short.addedBy; }
function teUpdatedAt(short) { return Math.max(short.addedAt || 0, ...refsOf(short.id).map((r) => r.updatedAt || 0)); }
function teBlankItem(item) { return { ...emptyAnswer(item), keyPoints: [] }; }
function teNormContent(content) {
  const c = {};
  for (const item of RUBRIC) { const v = content && content[item.key]; c[item.key] = { ...teBlankItem(item), ...(v ? clone(v) : {}) }; }
  return c;
}
function teLiveJob(shortId) { return activeJobFor(shortId, 'ingest') || activeJobFor(shortId, 'reference'); }
// 가져오는 중인 쇼츠는 메타데이터 단계가 끝나야 제목, 길이, 조회수를 알 수 있어요
function teMetaKnown(short, t) {
  if (short.status !== 'fetching') return true;
  const j = teLiveJob(short.id);
  return !!j && j.status === 'running' && jobProgress(j, t).stepIndex > 0;
}
function teDecided(ref) { const r = (ref && ref.review) || {}; return RUBRIC.filter((i) => r[i.key]).length; }
function teLowCount(ref) { const r = ref.review || {}; return RUBRIC.filter((i) => !r[i.key] && (ref.content[i.key] || {}).confidence === 'low').length; }
function teProblemsByKey(problems) { const m = {}; for (const p of problems) (m[p.key] = m[p.key] || []).push(p); return m; }
function teScrollTo(id) { setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80); }
function teScrollTop() { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch {} }
function teDiff(a, b) { // 앞뒤로 같은 낱말을 빼고 가운데만 비교합니다
  const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/);
  let i = 0; while (i < A.length && i < B.length && A[i] === B[i]) i++;
  let j = 0; while (j < A.length - i && j < B.length - i && A[A.length - 1 - j] === B[B.length - 1 - j]) j++;
  return { pre: A.slice(0, i).join(''), del: A.slice(i, A.length - j).join(''), ins: B.slice(i, B.length - j).join(''), post: A.slice(A.length - j).join('') };
}
function teRefsUsed(shortId) {
  return db.references.filter((r) => r.source === 'teacher' && r.status === 'published' && r.shortId !== shortId)
    .map((r) => byId(db.shorts, r.shortId)).filter(Boolean)
    .sort((a, b) => hashStr(shortId + a.id) - hashStr(shortId + b.id)).slice(0, 3);
}
function teKeyPoints(v) {
  return (v.keyPoints || []).length ? html`<div class="row-wrap" style=${{ gap: '6px' }}><span class="tiny muted">채점 포인트</span>${v.keyPoints.map((k) => html`<span class="tag">${k}</span>`)}</div>` : null;
}

// 작업 한 줄: 단계 이름, 진행률
// 다시 시도: AI 초안과 함께 등록했던 쇼츠는 AI 초안 작업으로 다시 돌려요 (retryShort는 등록만 다시 해요)
function teRetry(s) {
  const last = db.jobs.find((j) => j.shortId === s.id && j.status === 'failed');
  if (last && last.kind === 'reference' && !activeJobFor(s.id, 'reference')) {
    s.status = 'fetching'; s.failReason = null;
    createJob('reference', s, me().id, { noFail: true }); commit();
  } else retryShort(s.id);
  toast({ title: last && last.kind === 'reference' ? '다시 가져오고 AI 초안도 만들게요' : '다시 가져오고 있어요', body: s.title });
}
function TeJobLine({ job, t, width }) {
  if (!job) return null;
  if (job.status === 'queued') { const q = queuePosition(job); return html`<span class="tiny muted">대기 중 · ${q ? `앞에 ${q}개` : '곧 시작해요'}</span>`; }
  if (job.status !== 'running') return null;
  const p = jobProgress(job, t);
  return html`<div class="te-jobline" style=${{ width: width || '150px' }}>
    <div class="row tiny" style=${{ gap: '6px' }}><span class="grow ellipsis soft">${job.plan[p.stepIndex].label}</span><span class="num muted">${p.pct}%</span></div>
    <${Progress} value=${p.pct} />
  </div>`;
}

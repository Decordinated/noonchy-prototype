// ── 쇼츠 분석 데이터 목록 ─────────────────────────────
function TeDatasetPage() {
  const u = me();
  const [preset] = useState(() => { const p = teDatasetPreset || {}; teDatasetPreset = null; return p; });
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState(preset.filter || 'all');
  const [author, setAuthor] = useState(preset.author || 'all');
  const [sort, setSort] = useState('updated');
  const [addOpen, setAddOpen] = useState(!!preset.add);
  const [skipped, setSkipped] = useState(null);
  const [preview, setPreview] = useState(null);
  const [del, setDel] = useState(null);
  const mobile = useMedia('(max-width: 767px)');
  const wrapRef = useRef();
  useOutside(wrapRef, () => setAddOpen(false), addOpen && !mobile);
  const all = db.shorts.map((s) => ({ s, st: datasetStatus(s), owner: teOwnerId(s), updated: teUpdatedAt(s) }));
  const live = all.some((r) => r.st.key === 'fetching' || r.st.key === 'ai-running');
  const t = useNow(500, live);
  const ql = q.trim().toLowerCase();
  const base = all.filter((r) => (!ql || [r.s.title, r.s.channel, r.s.videoId].some((x) => String(x || '').toLowerCase().includes(ql)))
    && (author === 'all' || (author === 'me' ? r.owner === u.id : r.owner === author)));
  const count = (k) => base.filter((r) => TE_FILTERS[k](r.st.key)).length;
  const rows = base.filter((r) => TE_FILTERS[filter](r.st.key)).sort(TE_SORTS[sort][1]);
  const others = db.users.filter((x) => x.roles.includes('teacher') && x.id !== u.id);
  const resetFilters = () => { setQ(''); setFilter('all'); setAuthor('all'); };
  const onAdded = (ok, bad, ai) => {
    setAddOpen(false);
    setSkipped(bad.length ? bad : null);
    if (ok.length) { resetFilters(); setSort('updated'); }
    toast(ok.length
      ? { title: `쇼츠 ${ok.length}개를 등록했어요`, body: ai ? '영상을 가져오고 AI 초안까지 만들면 알려 드릴게요.' : '영상을 가져오면 알려 드릴게요.' }
      : { title: '새로 등록한 쇼츠가 없어요', body: '목록 위에서 이유를 확인해 주세요.', tone: 'bad' });
  };
  const openLabel = (s) => ({ published: '정답지 보기', ai: '검수하기', draft: '이어서 쓰기' }[datasetStatus(s).key] || '정답지 쓰기');
  return html`<div class="stack-lg">
    <div class="page-head">
      <div class="grow"><h2>쇼츠 분석 데이터</h2><p>쇼츠를 등록하고 정답지를 써서 게시하면 학생 채점에 쓰여요.</p></div>
      <div class="te-add-wrap" ref=${wrapRef}>
        <button type="button" class="btn btn-primary" aria-expanded=${String(addOpen)} onClick=${() => setAddOpen(!addOpen)}><${Icon} name="plus" size="sm" />쇼츠 추가</button>
        ${addOpen && html`${mobile && html`<div class="scrim te-scrim" onClick=${() => setAddOpen(false)}></div>`}<${TeAddPanel} onClose=${() => setAddOpen(false)} onDone=${onAdded} mobile=${mobile} />`}
      </div>
    </div>

    ${skipped && html`<${Callout} tone="warn" icon="alert" action=${html`<button type="button" class="btn btn-ghost btn-icon btn-sm" onClick=${() => setSkipped(null)} aria-label="안내 닫기"><${Icon} name="x" size="sm" /></button>`}>
      <div class="strong">링크 ${skipped.length}개는 등록하지 않았어요</div>
      <ul class="te-skip">${skipped.map((s) => html`<li><span class="mono te-skip-url">${s.raw}</span><span class="soft">${s.reason}</span>${s.short && html`<button type="button" class="btn btn-sm btn-ghost" style=${{ height: '26px' }} onClick=${() => nav('editor', { shortId: s.short.id })}>열기</button>`}</li>`)}</ul>
    <//>`}

    <div class="te-toolbar">
      <${SearchInput} value=${q} onInput=${setQ} placeholder="제목, 채널 검색" style=${{ flex: '1 1 160px', maxWidth: mobile ? null : '260px' }} />
      <${Seg} label="상태" value=${filter} onChange=${setFilter} options=${[{ value: 'all', label: '전체', count: count('all') }, { value: 'draft', label: '초안', count: count('draft') }, { value: 'published', label: '게시됨', count: count('published') }, { value: 'ai', label: 'AI 초안', count: count('ai') }]} />
      <span class="spacer desktop-only"></span>
      <select class="select te-select" value=${author} onChange=${(e) => setAuthor(e.target.value)} aria-label="작성자">
        <option value="all">작성자: 전체</option><option value="me">작성자: 나</option>
        ${others.map((x) => html`<option value=${x.id}>작성자: ${x.name}</option>`)}
      </select>
      <select class="select te-select" value=${sort} onChange=${(e) => setSort(e.target.value)} aria-label="정렬">
        ${Object.entries(TE_SORTS).map(([k, v]) => html`<option value=${k}>${v[0]}</option>`)}
      </select>
    </div>

    ${!all.length ? html`<div class="card"><${Empty} icon="dbzap" title="아직 등록한 쇼츠가 없어요" desc="유튜브 쇼츠 링크를 붙여 넣으면 영상 정보와 자막을 가져와요." action=${html`<button class="btn btn-primary btn-sm" onClick=${() => setAddOpen(true)}>쇼츠 추가</button>`} /></div>`
    : !rows.length ? html`<div class="card"><${Empty} icon="search" title="조건에 맞는 쇼츠가 없어요" desc="검색어나 필터를 바꿔 보세요." action=${html`<button class="btn btn-sm" onClick=${resetFilters}>필터 초기화</button>`} /></div>`
    : mobile ? html`<div class="te-dcards">${rows.map((r) => html`<${TeDatasetCard} key=${r.s.id} r=${r} t=${t} onPreview=${setPreview} onDelete=${setDel} />`)}<div class="tiny muted" style=${{ textAlign: 'center' }}>${rows.length}개${rows.length !== all.length ? ` · 전체 ${all.length}개` : ''}</div></div>`
    : html`<div class="card">
        <div class="table-wrap"><table class="table te-table">
          <thead><tr><th>쇼츠</th><th>길이</th><th>조회수</th><th>상태</th><th>작성자</th><th>수정</th></tr></thead>
          <tbody>${rows.map((r) => html`<${TeDatasetRow} key=${r.s.id} r=${r} t=${t} onPreview=${setPreview} onDelete=${setDel} />`)}</tbody>
        </table></div>
        <div class="card-foot"><span class="tiny muted grow">${rows.length}개${rows.length !== all.length ? ` · 전체 ${all.length}개` : ''}</span><span class="tiny muted">썸네일을 누르면 미리 볼 수 있어요</span></div>
      </div>`}

    ${preview && html`<${PreviewModal} short=${preview} onClose=${() => setPreview(null)} actions=${html`<button class="btn" onClick=${() => setPreview(null)}>닫기</button><button class="btn btn-primary" onClick=${() => { const id = preview.id; setPreview(null); nav('editor', { shortId: id }); }}>${openLabel(preview)}</button>`} />`}
    ${del && html`<${TeDeleteModal} short=${del} onClose=${() => setDel(null)} />`}
  </div>`;
}
PAGES.dataset = TeDatasetPage;

// 쇼츠 추가: 버튼에서 펼쳐지는 패널 (cult-ui floating-panel 자리). 모바일에서는 아래 시트.
function TeAddPanel({ onClose, onDone, mobile }) {
  const [text, setText] = useState('');
  const [ai, setAi] = useState(true);
  const taRef = useRef();
  useEffect(() => { if (taRef.current && !mobile) taRef.current.focus(); }, []);
  useEffect(() => { if (!mobile) return; const k = (e) => { if (e.key === 'Escape') onClose(); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, [mobile]);
  const max = MAX_LINKS.teacher;
  const links = splitLinks(text);
  const over = links.length > max;
  let fresh = 0, exist = 0, bad = 0, dup = 0; const seen = new Set();
  for (const raw of links.slice(0, max)) { const v = parseShortUrl(raw); if (!v) bad++; else if (seen.has(v)) dup++; else { seen.add(v); if (findShortByVideo(v)) exist++; else fresh++; } }
  const add = (url) => { setText((x) => (x.trim() ? x.replace(/\s+$/, '') + '\n' : '') + url); if (taRef.current && !mobile) taRef.current.focus(); };
  const submit = (e) => {
    e.preventDefault(); if (!links.length) return;
    const res = addShorts(links, { aiDraft: ai });
    const extra = links.slice(max).map((raw) => ({ raw, ok: false, reason: `한 번에 ${max}개까지만 등록해요` }));
    onDone(res.filter((r) => r.ok), [...res.filter((r) => !r.ok), ...extra], ai);
  };
  return html`<form class="te-panel" role="dialog" aria-label="쇼츠 추가" onSubmit=${submit}>
    <div class="row-top">
      <div class="grow stack-sm" style=${{ gap: '2px' }}><span class="strong" style=${{ fontSize: '15px' }}>쇼츠 추가</span><span class="tiny muted">링크를 한 줄에 하나씩 붙여 넣어요. 제목, 채널, 조회수, 자막을 자동으로 가져와요.</span></div>
      <button type="button" class="btn btn-ghost btn-icon btn-sm" onClick=${onClose} aria-label="닫기"><${Icon} name="x" size="sm" /></button>
    </div>
    <textarea ref=${taRef} class="textarea mono" rows="5" value=${text} onInput=${(e) => setText(e.target.value)} placeholder=${'https://youtube.com/shorts/...\nhttps://youtu.be/...'} aria-label="쇼츠 링크"></textarea>
    <div class="row-wrap tiny" style=${{ gap: '4px 10px' }}>
      <span class=${'num strong' + (over ? ' te-bad' : '')}>${links.length} / ${max}</span>
      ${links.length > 0 && html`<span class="muted">새 쇼츠 ${fresh}${exist ? ` · 이미 있음 ${exist}` : ''}${bad ? ` · 링크 아님 ${bad}` : ''}${dup ? ` · 겹침 ${dup}` : ''}</span>`}
      ${over && html`<span class="te-bad">앞의 ${max}개만 등록해요</span>`}
    </div>
    <div class="stack-sm" style=${{ gap: '6px' }}>
      <span class="tiny muted">예시 링크 넣기 (프로토타입이라 실제 영상은 가져오지 않아요)</span>
      <div class="row-wrap" style=${{ gap: '6px' }}>${TE_SAMPLES.map((s) => html`<button type="button" class="chip te-chip" onClick=${() => add(s.make())}>${s.label}</button>`)}</div>
    </div>
    <label class="te-check">
      <input type="checkbox" checked=${ai} onChange=${(e) => setAi(e.target.checked)} />
      <span class="stack-sm" style=${{ gap: '1px' }}><span class="strong small">AI 초안도 같이 만들기</span><span class="tiny soft">AI가 먼저 정답지 초안을 써 두면 검수만 하면 돼요.</span></span>
    </label>
    <div class="row" style=${{ justifyContent: 'flex-end', gap: '8px' }}>
      <button type="button" class="btn" onClick=${onClose}>취소</button>
      <button type="submit" class="btn btn-primary" disabled=${!links.length}>${links.length ? `${Math.min(links.length, max)}개 등록` : '등록'}</button>
    </div>
  </form>`;
}

// 상태 아래 한 줄: 진행 중이면 단계와 진행률, 실패면 이유와 버튼
function TeStatusDetail({ s, st, t, onDelete }) {
  if (st.key === 'fetching' || st.key === 'ai-running') return html`<${TeJobLine} job=${teLiveJob(s.id)} t=${t} />`;
  if (st.key === 'failed') return html`<div class="stack-sm" style=${{ gap: '6px' }} onClick=${(e) => e.stopPropagation()}>
    <span class="tiny te-bad">${s.failReason || '영상을 가져오지 못했어요'}</span>
    <span class="row" style=${{ gap: '6px' }}>
      <button type="button" class="btn btn-sm" onClick=${() => teRetry(s)}><${Icon} name="refresh" size="xs" />다시 시도</button>
      <button type="button" class="btn btn-sm btn-ghost btn-danger" onClick=${() => onDelete(s)}><${Icon} name="trash" size="xs" />삭제</button>
    </span>
  </div>`;
  if (st.key === 'draft') { const n = refReadyCount(teacherRefOf(s.id).content); return html`<span class="te-mini" title=${`${n}/10 작성`}><${Progress} value=${n * 10} /></span>`; }
  if (st.key === 'ai') return html`<span class="tiny muted">검수 ${teDecided(modelRefOf(s.id))}/10</span>`;
  if (st.key === 'published') { const n = db.submissions.filter((x) => x.shortId === s.id && x.status === 'scored').length; return n ? html`<span class="tiny muted">학생 채점 ${n}회</span>` : null; }
  return null;
}
function TeAuthorCell({ s }) {
  const r = teacherRefOf(s.id);
  if (r) return html`<span>${teName(r.authorId)}</span>`;
  return html`<span class="stack-sm" style=${{ gap: 0 }}><span class="soft">${teName(s.addedBy)}</span><span class="tiny muted">등록</span></span>`;
}
function TeDatasetRow({ r, t, onPreview, onDelete }) {
  const { s, st } = r;
  const known = teMetaKnown(s, t);
  return html`<tr class="clickable" onClick=${() => nav('editor', { shortId: s.id })}>
    <td><div class="te-title-cell">
      <${Thumb} short=${s} onClick=${s.status === 'ready' ? (e) => { e.stopPropagation(); onPreview(s); } : null} />
      ${known ? html`<div class="stack-sm" style=${{ gap: '1px', minWidth: 0 }}><span class="strong ellipsis" title=${s.title}>${s.title}</span><span class="tiny muted ellipsis">${s.channel}</span></div>`
        : html`<div class="stack-sm" style=${{ gap: '7px' }} aria-label="영상 정보 가져오는 중"><span class="skeleton te-sk" style=${{ width: '150px', height: '12px' }}></span><span class="skeleton te-sk" style=${{ width: '80px', height: '10px' }}></span></div>`}
    </div></td>
    <td class="num muted">${known ? teDur(s.durationSec) : html`<span class="skeleton te-sk"></span>`}</td>
    <td class="num">${known ? fmtViews(s.views) : html`<span class="skeleton te-sk"></span>`}</td>
    <td><div class="te-status-cell"><${DatasetBadge} short=${s} /><${TeStatusDetail} s=${s} st=${st} t=${t} onDelete=${onDelete} /></div></td>
    <td><${TeAuthorCell} s=${s} /></td>
    <td class="muted te-nowrap">${fmtRel(r.updated)}</td>
  </tr>`;
}
function TeDatasetCard({ r, t, onPreview, onDelete }) {
  const { s, st } = r;
  const known = teMetaKnown(s, t);
  const tRef = teacherRefOf(s.id);
  const open = () => nav('editor', { shortId: s.id });
  return html`<div class="card te-dcard" role="button" tabIndex="0" onClick=${open} onKeyDown=${(e) => { if (e.key === 'Enter') open(); }}>
    <${Thumb} short=${s} onClick=${s.status === 'ready' ? (e) => { e.stopPropagation(); onPreview(s); } : null} />
    <div class="grow stack-sm" style=${{ gap: '5px' }}>
      ${known ? html`<span class="strong te-2line">${s.title}</span><span class="tiny muted ellipsis">${s.channel} · ${teDur(s.durationSec)} · 조회수 ${fmtViews(s.views)}</span>`
        : html`<span class="skeleton te-sk" style=${{ width: '70%', height: '12px' }}></span><span class="skeleton te-sk" style=${{ width: '45%', height: '10px' }}></span>`}
      <div class="row-wrap" style=${{ gap: '6px' }}><${DatasetBadge} short=${s} /><span class="tiny muted">${tRef ? teName(tRef.authorId) : teName(s.addedBy) + ' 등록'} · ${fmtRel(r.updated)}</span></div>
      <${TeStatusDetail} s=${s} st=${st} t=${t} onDelete=${onDelete} />
    </div>
  </div>`;
}
function TeDeleteModal({ short, onClose, onDone }) {
  const remove = () => { const title = short.title; removeShort(short.id); onClose(); toast({ title: '목록에서 지웠어요', body: title }); if (onDone) onDone(); };
  return html`<${Modal} title="이 쇼츠를 지울까요?" onClose=${onClose} foot=${html`<button class="btn" onClick=${onClose}>그대로 두기</button><button class="btn btn-dark" onClick=${remove}>지우기</button>`}>
    <p class="soft">'${short.title}' 쇼츠와 이 쇼츠의 정답지, AI 초안이 함께 지워져요. 지운 뒤에는 되돌릴 수 없어요.</p>
  <//>`;
}

// ── 정답지 작성 ─────────────────────────────────────
function TeEditorPage({ params }) {
  const short = byId(db.shorts, params.shortId);
  if (!short) return html`<div class="card"><${Empty} icon="alert" title="찾을 수 없는 쇼츠예요" desc="목록에서 지워졌을 수 있어요." action=${html`<button class="btn btn-sm" onClick=${() => nav('dataset')}>목록으로</button>`} /></div>`;
  if (short.status === 'fetching') return html`<${TeWaiting} short=${short} />`;
  if (short.status === 'failed') return html`<${TeFailed} short=${short} />`;
  return html`<${TeEditor} short=${short} />`;
}
PAGES.editor = TeEditorPage;

function TeWaiting({ short }) {
  const job = teLiveJob(short.id);
  const t = useNow(400);
  const known = teMetaKnown(short, t);
  const p = job && job.status === 'running' ? jobProgress(job, t) : null;
  return html`<div class="te-narrow">
    <div class="card card-pad stack-lg">
      <div class="row-top" style=${{ gap: '16px' }}>
        <${Thumb} short=${short} size=${known ? 'md' : ''} />
        <div class="grow stack-sm">
          <span><span class="badge badge-outline"><span class="te-pulse"></span>가져오는 중</span></span>
          <h2 style=${{ fontSize: '18px' }}>${known ? short.title : '영상 정보를 가져오고 있어요'}</h2>
          <span class="small muted mono ellipsis">${short.url}</span>
        </div>
      </div>
      ${job ? html`<ol class="te-steps">${job.plan.map((st, i) => { const state = !p ? 'todo' : i < p.stepIndex ? 'done' : i === p.stepIndex ? 'now' : 'todo'; return html`<li class=${'te-step ' + state}><span class="te-step-dot">${state === 'done' ? html`<${Icon} name="check" size="xs" />` : i + 1}</span><span class="grow">${st.label}</span>${state === 'now' && html`<span class="tiny muted num">${p.pct}%</span>`}</li>`; })}</ol>
        <${Progress} value=${p ? p.pct : 0} indeterminate=${!p} />
        <p class="small soft">${job.status === 'queued' ? `대기 중이에요${queuePosition(job) ? ` (앞에 ${queuePosition(job)}개)` : ''}. 곧 시작해요. ` : ''}다른 일을 하셔도 돼요. 끝나면 알림으로 알려 드릴게요.${job.kind === 'reference' ? ' 영상을 가져온 뒤 AI 초안도 만들어요.' : ''}</p>`
      : html`<p class="small soft">작업 정보를 찾지 못했어요. 목록에서 상태를 확인해 주세요.</p>`}
      <div class="row-wrap">
        <button class="btn" onClick=${() => nav('dataset')}><${Icon} name="arrowL" size="sm" />목록으로</button>
        <button class="btn" onClick=${openJobs}><${Icon} name="tasks" size="sm" />작업 패널</button>
        ${job && job.status === 'queued' && html`<button class="btn btn-ghost btn-danger" onClick=${() => cancelJob(job.id)}>등록 취소</button>`}
      </div>
    </div>
  </div>`;
}

function TeFailed({ short }) {
  const [ask, setAsk] = useState(false);
  return html`<div class="te-narrow">
    <div class="card card-pad stack">
      <div class="row-top" style=${{ gap: '16px' }}>
        <${Thumb} short=${short} size="md" />
        <div class="grow stack-sm">
          <span><span class="badge badge-bad">가져오지 못함</span></span>
          <h2 style=${{ fontSize: '18px' }}>${short.title}</h2>
          <span class="small muted mono ellipsis">${short.url}</span>
        </div>
      </div>
      <${Callout} tone="bad" icon="alert"><b>${short.failReason || '영상을 가져오지 못했어요'}</b><br />공개된 3분 이하 쇼츠인지 확인한 뒤 다시 시도하거나, 목록에서 지워 주세요.<//>
      <div class="row-wrap">
        <button class="btn btn-primary" onClick=${() => teRetry(short)}><${Icon} name="refresh" size="sm" />다시 시도</button>
        <button class="btn btn-danger" onClick=${() => setAsk(true)}><${Icon} name="trash" size="sm" />삭제</button>
        <button class="btn btn-ghost" onClick=${() => nav('dataset')}>목록으로</button>
      </div>
    </div>
    ${ask && html`<${TeDeleteModal} short=${short} onClose=${() => setAsk(false)} onDone=${() => nav('dataset')} />`}
  </div>`;
}

function TeEditor({ short }) {
  const u = me();
  const tRef = teacherRefOf(short.id);
  const mRef = modelRefOf(short.id);
  const refJob = activeJobFor(short.id, 'reference');
  const published = !!tRef && tRef.status === 'published';
  const [mode, setMode] = useState(() => (mRef && !tRef ? 'review' : 'write'));
  const view = published ? 'view' : mode === 'review' && mRef ? 'review' : 'write';
  const [content, setContentState] = useState(() => teNormContent(tRef && tRef.content));
  const cRef = useRef(content);
  const setContent = (c) => { cRef.current = c; setContentState(c); };
  const problems = validateReference(content);
  const probBy = teProblemsByKey(problems);
  const [attempted, setAttempted] = useState(false);
  const [tried, setTried] = useState(false); // AI 초안 게시를 눌러 봤는지
  const [open, setOpen] = useState(() => { const first = RUBRIC.find((i) => probBy[i.key]); return new Set([first ? first.key : RUBRIC[0].key]); });
  const [savedAt, setSavedAt] = useState(null);
  const [ask, setAsk] = useState(null); // 'unpublish' | 'import' | 'promote'
  const t = useNow(refJob ? 500 : 15000);
  // 게시, 게시 취소, AI 초안 가져오기로 정답지가 바뀌면 화면 내용을 다시 맞춥니다
  useEffect(() => { const r = teacherRefOf(short.id); if (r) setContent(teNormContent(r.content)); }, [tRef && tRef.id, tRef && tRef.status]);
  // AI 초안이 새로 생겼는데 직접 쓴 초안이 없으면 검수 화면으로
  useEffect(() => { if (mRef && !teacherRefOf(short.id)) setMode('review'); }, [mRef && mRef.id]);

  const change = (key, v) => {
    const next = { ...cRef.current, [key]: v };
    setContent(next);
    const r = teacherRefOf(short.id);
    if (r) saveReference(r.id, next, true);
    else { const nr = ensureTeacherDraft(short.id); saveReference(nr.id, next, false); }
    setSavedAt(now());
  };
  const publish = () => {
    const probs = validateReference(cRef.current);
    if (probs.length) {
      setAttempted(true);
      const keys = [...new Set(probs.map((p) => p.key))];
      setOpen(new Set([...open, ...keys]));
      teScrollTo('te-item-' + keys[0]);
      return;
    }
    let r = teacherRefOf(short.id);
    if (!r) { r = ensureTeacherDraft(short.id); saveReference(r.id, cRef.current, true); }
    const res = publishReference(r.id);
    if (!res.ok) { setAttempted(true); return; }
    setAttempted(false);
    toast({ title: '게시했어요. 이제 학생 채점에 쓰여요', body: short.title });
    teScrollTop();
  };
  const unpublish = () => { unpublishReference(tRef.id); setAsk(null); setMode('write'); toast({ title: '게시를 취소했어요', body: '초안으로 돌아갔어요. 고친 뒤 다시 게시해 주세요.' }); };
  const reqAi = () => { requestAiDraft(short.id); toast({ title: 'AI 초안을 요청했어요', body: '15초쯤 걸려요. 그동안 계속 써도 돼요.' }); };
  const doImport = () => {
    const existing = teacherRefOf(short.id);
    if (existing) db.references = db.references.filter((r) => r.id !== existing.id);
    const r = ensureTeacherDraft(short.id, true);
    const rv = (mRef && mRef.review) || {};
    for (const item of RUBRIC) if (rv[item.key] === 'rejected') r.content[item.key] = teBlankItem(item);
    r.updatedAt = now();
    commit();
    setContent(teNormContent(r.content)); setAttempted(false); setMode('write'); setAsk(null);
    setOpen(new Set([RUBRIC[0].key]));
    toast({ title: 'AI 초안을 가져왔어요', body: '직접 고쳐서 게시하면 돼요.' });
    teScrollTop();
  };
  const askImport = () => { const ex = teacherRefOf(short.id); if (ex && refReadyCount(ex.content) > 0) setAsk('import'); else doImport(); };
  const promote = (force) => {
    const ex = teacherRefOf(short.id);
    const rv = mRef.review || {};
    const ready = RUBRIC.every((i) => ['accepted', 'edited'].includes(rv[i.key]));
    if (!force && ready && ex && ex.status === 'draft' && refReadyCount(ex.content) > 0) { setAsk('promote'); return; }
    setAsk(null);
    const res = promoteModel(mRef.id);
    if (res.ok) { setTried(false); toast({ title: '선생님 정답지로 게시했어요', body: '이제 학생 채점에 쓰여요.' }); teScrollTop(); }
    else { setTried(true); teScrollTo('te-promote'); }
  };

  const filled = view === 'review' ? teDecided(mRef) : view === 'view' ? refReadyCount(tRef.content) : refReadyCount(content);
  const saveLabel = view === 'review' ? '검수한 내용은 바로 저장돼요'
    : view === 'view' ? `게시 ${fmtRel(tRef.publishedAt || tRef.updatedAt)}`
    : savedAt ? `자동 저장됨 · ${fmtRel(savedAt)}` : tRef ? `저장됨 · ${fmtRel(tRef.updatedAt)}` : '쓰면 자동으로 저장돼요';
  const subs = db.submissions.filter((s) => s.shortId === short.id && s.status === 'scored');
  const refPct = refJob && refJob.status === 'running' ? jobProgress(refJob, t).pct : null;
  const toggle = (key) => { const s = new Set(open); if (s.has(key)) s.delete(key); else s.add(key); setOpen(s); };

  return html`<div class="stack">
    <div class="card te-top">
      <${Thumb} short=${short} />
      <div class="te-top-title stack-sm" style=${{ gap: '3px' }}>
        <div class="row-wrap" style=${{ gap: '8px' }}><h2 class="te-h2">${short.title}</h2><${DatasetBadge} short=${short} /></div>
        <span class="small muted">${short.channel} · ${teDur(short.durationSec)} · 조회수 ${fmtViews(short.views)}${tRef && tRef.authorId !== u.id ? ` · ${teName(tRef.authorId)} 선생님 작성` : ''}</span>
      </div>
      <div class="te-top-side">
        <div class="te-top-prog"><span class="tiny muted">${view === 'review' ? '검수' : '작성'}</span><${Progress} value=${filled * 10} /><span class="num small strong">${filled} / 10</span></div>
        <span class="tiny muted te-save"><${Icon} name=${view === 'view' ? 'check' : 'clock'} size="xs" />${saveLabel}</span>
        <div class="te-top-actions">
          ${refJob && html`<span class="badge badge-dashed te-live"><${Icon} name="sparkles" size="xs" />AI 초안 ${refPct == null ? '대기 중' : `만드는 중 · ${refPct}%`}</span>`}
          ${!mRef && !refJob && !published && html`<button class="btn" onClick=${reqAi}><${Icon} name="sparkles" size="sm" />AI 초안 요청</button>`}
          ${published ? html`<button class="btn" onClick=${() => setAsk('unpublish')}>게시 취소</button>`
            : view === 'write' ? html`<button class="btn btn-primary" onClick=${publish}><${Icon} name="upload" size="sm" />게시</button>` : null}
        </div>
      </div>
    </div>

    ${mRef && !published && html`<div class="row-wrap te-modebar">
      <${Seg} label="작성 방식" value=${view} onChange=${setMode} options=${[{ value: 'review', label: 'AI 초안 검수' }, { value: 'write', label: '직접 쓰기' }]} />
      <span class="small muted">${view === 'review' ? 'AI가 쓴 초안을 항목마다 수락하거나 고쳐요.' : '영상과 자막을 보며 10개 항목을 직접 써요.'}</span>
    </div>`}

    ${published && html`<div class="te-grid te-pubrow">
      <${Callout} tone="ok" icon="check">게시된 정답지예요. 학생 채점에 쓰이고 있어요. 고치려면 위에서 [게시 취소]를 눌러 초안으로 돌려 주세요.<//>
      ${subs.length > 0 && html`<div class="card te-subs"><span class="stat-icon"><${Icon} name="users" size="sm" /></span><div class="grow stack-sm" style=${{ gap: 0 }}><span class="strong">학생 제출 ${subs.length}개 · 평균 ${Math.round(avg(subs.map((s) => s.evaluation.total)))}점</span><span class="tiny muted">이 쇼츠로 채점한 결과예요</span></div><button class="btn btn-sm" onClick=${() => nav('students')}>학생 결과</button></div>`}
    </div>`}

    <${TeStudio} short=${short} render=${(player) => view === 'review'
      ? html`<${TeReview} short=${short} mRef=${mRef} player=${player} tried=${tried} onPromote=${() => promote(false)} onImport=${askImport} />`
      : view === 'view'
        ? html`<${TeItemList} content=${teNormContent(tRef.content)} player=${player} open=${open} setOpen=${setOpen} toggle=${toggle} readOnly=${true} probBy=${{}} />`
        : html`<${TeItemList} content=${content} player=${player} open=${open} setOpen=${setOpen} toggle=${toggle} probBy=${probBy} attempted=${attempted} onChange=${change} onPublish=${publish} mRef=${mRef} refJob=${refJob} onImport=${askImport} />`} />

    ${ask === 'unpublish' && html`<${Modal} title="게시를 취소할까요?" onClose=${() => setAsk(null)} foot=${html`<button class="btn" onClick=${() => setAsk(null)}>그대로 두기</button><button class="btn btn-dark" onClick=${unpublish}>게시 취소</button>`}>
      <p class="soft">초안으로 돌아가요. 다시 게시하기 전까지 이 정답지는 새 채점에 쓰이지 않아요. 이미 끝난 채점은 그대로예요.</p>
    <//>`}
    ${ask === 'import' && html`<${Modal} title="쓰던 초안을 AI 초안으로 바꿀까요?" onClose=${() => setAsk(null)} foot=${html`<button class="btn" onClick=${() => setAsk(null)}>그대로 두기</button><button class="btn btn-dark" onClick=${doImport}>AI 초안으로 바꾸기</button>`}>
      <p class="soft">지금까지 쓴 내용(${refReadyCount((teacherRefOf(short.id) || {}).content)}/10)은 지워지고, AI 초안과 검수에서 고친 내용으로 채워져요. 거절한 항목은 비워 둬요.</p>
    <//>`}
    ${ask === 'promote' && html`<${Modal} title="AI 초안으로 게시할까요?" onClose=${() => setAsk(null)} foot=${html`<button class="btn" onClick=${() => setAsk(null)}>그대로 두기</button><button class="btn btn-primary" onClick=${() => promote(true)}>게시</button>`}>
      <p class="soft">직접 쓰던 초안(${refReadyCount((teacherRefOf(short.id) || {}).content)}/10)은 지워지고, 검수한 AI 초안이 선생님 정답지로 게시돼요.</p>
    <//>`}
  </div>`;
}

// 영상, 자막(왼쪽 고정) + 오른쪽 내용. 플레이어는 여기서 한 번만 만들고 오른쪽과 나눠 씁니다.
function TeStudio({ short, render }) {
  const player = usePlayer(short);
  const scRef = useRef();
  const cur = captionAt(short, player.t);
  useEffect(() => {
    const box = scRef.current; if (!box) return;
    const el = box.querySelector('.transcript-line.on'); if (!el) return;
    if (el.offsetTop < box.scrollTop || el.offsetTop + el.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 3);
  }, [cur && cur[0]]);
  return html`<div class="te-studio"><div class="te-studio-grid">
    <div class="te-left">
      <div class="card te-player-card"><div class="te-player-box"><${Player} player=${player} /></div><${PlayerControls} player=${player} /></div>
      <div class="card te-tr-card">
        <div class="te-tr-head"><span class="strong grow">자막</span><span class="tiny muted">누르면 그 시점으로 가요</span></div>
        <div class="te-tr-scroll" ref=${scRef}><${Transcript} player=${player} /></div>
      </div>
    </div>
    <div class="te-right">${render(player)}</div>
  </div></div>`;
}

// 직접 쓰기(A안 워크벤치)와 게시된 정답지 보기에 함께 씁니다
function TeItemList({ content, player, open, setOpen, toggle, probBy, attempted, onChange, onPublish, readOnly, mRef, refJob, onImport }) {
  const allOpen = open.size === RUBRIC.length;
  const probKeys = RUBRIC.filter((i) => probBy[i.key]);
  const n = refReadyCount(content);
  return html`<div class="stack" style=${{ gap: '10px' }}>
    <div class="row-wrap te-items-head">
      <span class="section-title">분석</span><span class="badge badge-outline">양식 v1 · 10개 항목</span>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost btn-sm" onClick=${() => setOpen(allOpen ? new Set() : new Set(RUBRIC.map((i) => i.key)))}><${Icon} name=${allOpen ? 'chevU' : 'chevD'} size="xs" />${allOpen ? '모두 접기' : '모두 펼치기'}</button>
    </div>
    ${!readOnly && mRef && n === 0 && html`<${Callout} icon="sparkles" action=${html`<button class="btn btn-sm" onClick=${onImport}>AI 초안 가져오기</button>`}>AI 초안이 있어요. 가져와서 고쳐 쓰면 더 빨라요.<//>`}
    ${!readOnly && refJob && html`<${Callout} tone="neutral" icon="sparkles">AI 초안을 만들고 있어요. 다 되면 'AI 초안 검수'에서 볼 수 있어요. 그동안 직접 써도 돼요.<//>`}
    ${!readOnly && attempted && (probKeys.length
      ? html`<div id="te-problems"><${Callout} tone="bad" icon="alert">
          <div class="strong">게시하려면 ${probKeys.length}개 항목을 더 채워 주세요</div>
          <ul class="te-plist">${probKeys.map((i) => html`<li><button type="button" class="te-plink" onClick=${() => { setOpen(new Set([...open, i.key])); teScrollTo('te-item-' + i.key); }}>${i.n}. ${i.title}</button> <span class="soft">${probBy[i.key].map((p) => p.msg).join(', ')}</span></li>`)}</ul>
        <//></div>`
      : html`<${Callout} tone="ok" icon="check" action=${html`<button class="btn btn-sm btn-primary" onClick=${onPublish}>게시</button>`}>빠진 곳을 다 채웠어요. 이제 게시할 수 있어요.<//>`)}
    ${RUBRIC.map((item) => html`<${TeItemCard} key=${item.key} item=${item} value=${content[item.key]} open=${open.has(item.key)} onToggle=${() => toggle(item.key)} onChange=${(v) => onChange(item.key, v)} player=${player} problems=${probBy[item.key] || []} attempted=${attempted} readOnly=${readOnly} />`)}
    ${!readOnly && html`<div class="te-bottom">
      <span class="small muted grow">${probKeys.length ? `게시하려면 ${probKeys.length}개 항목을 더 채워야 해요` : '10개 항목을 모두 채웠어요'}</span>
      <button class="btn btn-primary" onClick=${onPublish}><${Icon} name="upload" size="sm" />게시</button>
    </div>`}
  </div>`;
}

function TeItemCard({ item, value, open, onToggle, onChange, player, problems, attempted, readOnly }) {
  const v = value || teBlankItem(item);
  const filled = isItemFilled(item, v);
  const ok = readOnly || problems.length === 0;
  const bad = !readOnly && attempted && !ok;
  const preview = (item.kind === 'segments' ? (v.segments || []).map((s) => s.name).join(' → ') : '') || v.text || '';
  const status = readOnly ? null
    : ok ? html`<span class="te-st ok"><${Icon} name="check" size="xs" />작성됨</span>`
    : bad ? html`<span class="te-st bad">${problems.length}개 빠짐</span>`
    : filled ? html`<span class="te-st warn">${problems.length}개 더 채우기</span>`
    : html`<span class="te-st">아직 안 씀</span>`;
  return html`<div class=${'card te-item' + (open ? ' open' : '') + (bad ? ' bad' : '')} id=${'te-item-' + item.key}>
    <button type="button" class="te-item-head" onClick=${onToggle} aria-expanded=${String(open)}>
      <span class=${'item-num ' + (ok ? 'done' : 'todo')}>${item.n}</span>
      <span class="grow stack-sm" style=${{ gap: '1px', minWidth: 0 }}>
        <span class="row" style=${{ gap: '8px' }}><span class="strong">${item.title}</span><span class="badge desktop-only">${teAreaName(item.area)}</span></span>
        <span class=${'tiny muted' + (open ? '' : ' ellipsis')}>${open ? item.q : preview || item.help}</span>
      </span>
      ${status}
      <${Icon} name=${open ? 'chevU' : 'chevD'} size="sm" />
    </button>
    ${open && html`<div class="te-item-body">
      ${readOnly ? html`<${ItemView} item=${item} value=${v} player=${player} />${teKeyPoints(v)}`
        : html`<div class="te-guide"><${Icon} name="bulb" size="sm" /><span>${item.guide} <span class="muted">${item.scoring}</span></span></div>
          <${ItemEditor} item=${item} value=${v} onChange=${onChange} player=${player} teacher=${true} problems=${attempted ? problems : []} idPrefix="te" />`}
    </div>`}
  </div>`;
}

// ── AI 초안 검수 (C안) ───────────────────────────────
function TeReview({ short, mRef, player, tried, onPromote, onImport }) {
  const rv = mRef.review || {};
  const firstUndecided = () => (RUBRIC.find((i) => !(mRef.review || {})[i.key]) || {}).key || null;
  const [current, setCurrent] = useState(firstUndecided);
  const [editing, setEditing] = useState(null);
  const [flagged, setFlagged] = useState(() => new Set());
  const counts = { accepted: 0, edited: 0, rejected: 0 };
  for (const i of RUBRIC) if (rv[i.key]) counts[rv[i.key]]++;
  const left = RUBRIC.length - counts.accepted - counts.edited - counts.rejected;
  const pending = RUBRIC.filter((i) => !['accepted', 'edited'].includes(rv[i.key]));
  const eff = effectiveContent(mRef);
  const finalContent = {}; for (const i of RUBRIC) finalContent[i.key] = stripAi(eff[i.key] || {});
  const probBy = teProblemsByKey(validateReference(finalContent));
  const probKeys = RUBRIC.filter((i) => probBy[i.key]);
  const goNext = (after) => {
    const idx = RUBRIC.findIndex((i) => i.key === after);
    const order = [...RUBRIC.slice(idx + 1), ...RUBRIC.slice(0, idx)];
    const nx = order.find((i) => !(mRef.review || {})[i.key]);
    setCurrent(nx ? nx.key : null);
    if (nx) teScrollTo('te-item-' + nx.key);
  };
  const decide = (key, d) => { reviewItem(mRef.id, key, d); setEditing(null); goNext(key); };
  const save = (key, v) => { reviewItem(mRef.id, key, 'edited', v); setEditing(null); goNext(key); };
  const undo = (key) => { resetReview(mRef.id, key); setEditing(null); setCurrent(key); };
  const jump = (key, edit) => { setCurrent(key); if (edit) { setEditing(key); setFlagged(new Set([...flagged, key])); } teScrollTo('te-item-' + key); };
  const used = teRefsUsed(short.id);
  const foot = left && counts.rejected ? `남은 ${left}개를 검수하고 거절한 ${counts.rejected}개를 고치면 게시할 수 있어요.`
    : left ? `남은 ${left}개 항목을 검수하면 선생님 정답지로 게시할 수 있어요.`
    : counts.rejected ? `거절한 ${counts.rejected}개 항목은 고치거나 직접 써야 게시할 수 있어요.`
    : probKeys.length ? '빠진 곳을 채우면 게시할 수 있어요.' : '모두 검수했어요. 게시하면 학생 채점에 쓰여요.';
  return html`<div class="stack" style=${{ gap: '10px' }}>
    <div class="card card-pad stack te-rsum">
      <div class="row-wrap" style=${{ gap: '8px' }}>
        <span class="badge badge-dashed"><${Icon} name="sparkles" size="xs" />AI 초안</span>
        <span class="tiny muted">${modelOf(mRef.engine, mRef.model).name} · ${fmtRel(mRef.createdAt)}${mRef.requestedBy ? ` · ${teName(mRef.requestedBy)} 요청` : ''}</span>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-primary" onClick=${onPromote}>선생님 정답지로 게시</button>
      </div>
      <div class="row-wrap te-rcounts"><span>수락 <b>${counts.accepted}</b></span><span>고침 <b>${counts.edited}</b></span><span>거절 <b>${counts.rejected}</b></span><span>남음 <b>${left}</b></span></div>
      <${Progress} value=${(RUBRIC.length - left) * 10} />
      <p class="small soft">항목마다 수락하거나 고쳐 주세요. 10개를 모두 수락하거나 고치면 선생님 정답지로 게시할 수 있어요.</p>
      ${used.length > 0 && html`<div class="row-wrap" style=${{ gap: '6px' }}><span class="tiny muted">참고한 정답지</span>${used.map((s) => html`<span class="tag" style=${{ fontSize: '12px', minHeight: '24px' }}>${s.title}</span>`)}</div>`}
    </div>
    ${RUBRIC.map((item) => html`<${TeReviewCard} key=${item.key} item=${item} mRef=${mRef} player=${player}
      current=${current === item.key} editing=${editing === item.key} flagged=${flagged.has(item.key)}
      onToggle=${() => { if (editing === item.key) return; setCurrent(current === item.key ? null : item.key); }}
      onDecide=${(d) => decide(item.key, d)} onEdit=${() => { setEditing(item.key); setCurrent(item.key); }}
      onSave=${(v) => save(item.key, v)} onCancel=${() => setEditing(null)} onUndo=${() => undo(item.key)} />`)}
    ${tried && html`<div id="te-promote">${pending.length
      ? html`<${Callout} tone="bad" icon="alert"><div class="strong">아직 게시할 수 없어요. 수락하거나 고쳐야 할 항목이 ${pending.length}개 있어요</div>
          <ul class="te-plist">${pending.map((i) => html`<li><button type="button" class="te-plink" onClick=${() => jump(i.key, rv[i.key] === 'rejected')}>${i.n}. ${i.title}</button> <span class="soft">${rv[i.key] === 'rejected' ? '거절했어요. 직접 써야 해요' : '수락하거나 고쳐 주세요'}</span></li>`)}</ul><//>`
      : probKeys.length
        ? html`<${Callout} tone="bad" icon="alert"><div class="strong">게시하려면 채워야 할 곳이 있어요</div>
            <ul class="te-plist">${probKeys.map((i) => html`<li><button type="button" class="te-plink" onClick=${() => jump(i.key, true)}>${i.n}. ${i.title}</button> <span class="soft">${probBy[i.key].map((p) => p.msg).join(', ')}</span></li>`)}</ul><//>`
        : html`<${Callout} tone="ok" icon="check">모두 준비됐어요. 게시하면 학생 채점에 쓰여요.<//>`}</div>`}
    <div class="te-bottom">
      <span class="small grow">${foot}</span>
      <button class="btn" onClick=${onImport}><${Icon} name="pen" size="sm" />직접 쓰기로 가져오기</button>
      <button class="btn btn-primary" onClick=${onPromote}>선생님 정답지로 게시</button>
    </div>
  </div>`;
}

function TeReviewCard({ item, mRef, player, current, editing, flagged, onToggle, onDecide, onEdit, onSave, onCancel, onUndo }) {
  const raw = mRef.content[item.key] || {};
  const d = (mRef.review || {})[item.key];
  const edit = (mRef.edits || {})[item.key];
  const eff = { ...raw, ...(edit || {}) };
  const conf = TE_CONF[raw.confidence] || null;
  const low = raw.confidence === 'low' && !d;
  const open = current || editing;
  const dec = d ? TE_DECISION[d] : null;
  const preview = d === 'rejected' ? '거절했어요 · 직접 써야 해요' : ((item.kind === 'segments' ? (eff.segments || []).map((s) => s.name).join(' → ') : '') || eff.text || '');
  return html`<div class=${'card te-item' + (open ? ' open' : '') + (low ? ' low' : '') + (current && !d && !editing ? ' focus' : '')} id=${'te-item-' + item.key}>
    <button type="button" class="te-item-head" onClick=${onToggle} aria-expanded=${String(!!open)}>
      <span class=${'item-num ' + (d === 'accepted' || d === 'edited' ? 'done' : current ? 'current' : 'todo')}>${item.n}</span>
      <span class="grow stack-sm" style=${{ gap: '1px', minWidth: 0 }}>
        <span class="strong">${item.title}</span>
        ${!open && html`<span class="tiny muted ellipsis">${preview}</span>`}
      </span>
      ${dec ? html`<span class=${'badge ' + dec.cls}><${Icon} name=${dec.icon} size="xs" />${dec.label}</span>` : conf && html`<span class=${'badge ' + conf.cls}>${conf.label}</span>`}
      <${Icon} name=${open ? 'chevU' : 'chevD'} size="sm" />
    </button>
    ${open && html`<div class="te-item-body">
      ${editing ? html`<${TeReviewEditor} item=${item} initial=${d === 'rejected' ? teBlankItem(item) : stripAi(eff)} player=${player} flagged=${flagged} rejected=${d === 'rejected'} onSave=${onSave} onCancel=${onCancel} />`
      : html`
        <div class="te-ai-box">
          <div class="row tiny" style=${{ gap: '6px', color: 'var(--fg-3)' }}><${Icon} name=${d === 'edited' ? 'pen' : 'sparkles'} size="xs" />${d === 'edited' ? '고친 내용 (AI 초안과 다른 곳 표시)' : 'AI 초안'}</div>
          ${d === 'rejected' ? html`<p class="muted"><del>${raw.text}</del></p>` : html`<${TeItemContent} item=${item} value=${eff} base=${d === 'edited' ? raw : null} player=${player} />`}
        </div>
        ${low && raw.why && html`<${Callout} tone="warn" icon="alert"><b>AI가 확신하지 못했어요.</b> ${raw.why}<//>`}
        ${!d ? html`<div class="row-wrap te-actions">
            <button type="button" class="btn btn-sm" onClick=${() => onDecide('accepted')}><${Icon} name="check" size="xs" />수락</button>
            <button type="button" class="btn btn-sm" onClick=${onEdit}><${Icon} name="pen" size="xs" />고치기</button>
            <button type="button" class="btn btn-sm btn-ghost btn-danger" onClick=${() => onDecide('rejected')}><${Icon} name="x" size="xs" />거절</button>
          </div>`
        : html`<div class="row-wrap te-actions">
            <span class=${'small grow ' + (d === 'rejected' ? 'te-bad' : 'soft')}>${d === 'accepted' ? '수락했어요. 이대로 정답지에 들어가요.' : d === 'edited' ? '고친 내용으로 확정했어요.' : '거절했어요. 이 항목은 직접 써야 해요.'}</span>
            <button type="button" class="btn btn-sm" onClick=${onEdit}><${Icon} name="pen" size="xs" />${d === 'rejected' ? '직접 쓰기' : d === 'edited' ? '다시 고치기' : '고치기'}</button>
            <button type="button" class="btn btn-sm btn-ghost" onClick=${onUndo}><${Icon} name="history" size="xs" />되돌리기</button>
          </div>`}
      `}
    </div>`}
  </div>`;
}

function TeReviewEditor({ item, initial, player, flagged, rejected, onSave, onCancel }) {
  const [v, setV] = useState(() => ({ ...teBlankItem(item), ...clone(initial || {}) }));
  const probs = flagged ? validateReference({ [item.key]: v }).filter((p) => p.key === item.key) : [];
  return html`<div class="stack">
    <div class="te-guide"><${Icon} name="bulb" size="sm" /><span>${rejected ? 'AI 초안을 거절했어요. 이 항목을 직접 써 주세요. ' : ''}${item.guide}</span></div>
    <${ItemEditor} item=${item} value=${v} onChange=${setV} player=${player} teacher=${true} problems=${probs} idPrefix="rv" />
    <div class="row" style=${{ justifyContent: 'flex-end', gap: '8px' }}>
      <button type="button" class="btn btn-sm" onClick=${onCancel}>취소</button>
      <button type="button" class="btn btn-sm btn-primary" onClick=${() => onSave(v)}><${Icon} name="check" size="xs" />저장</button>
    </div>
  </div>`;
}

// 항목 내용 보기. 고친 항목이면 AI 초안과 달라진 글자를 표시합니다.
function TeItemContent({ item, value, base, player }) {
  const v = value || {};
  if (!base || (base.text || '') === (v.text || '')) return html`<div class="stack-sm" style=${{ gap: '8px' }}><${ItemView} item=${item} value=${v} player=${player} />${teKeyPoints(v)}</div>`;
  const df = teDiff(base.text, v.text);
  return html`<div class="stack-sm" style=${{ gap: '8px' }}>
    ${item.kind === 'hook' && v.hookType && html`<div class="row" style=${{ gap: '6px' }}><span class="badge badge-role">${v.hookType}</span>${base.hookType && base.hookType !== v.hookType && html`<span class="tiny muted">AI: ${base.hookType}</span>`}</div>`}
    <p class="te-diff">${df.pre}${df.del && html`<del class="diff">${df.del}</del>`}${df.ins && html`<ins class="diff">${df.ins}</ins>`}${df.post}</p>
    ${item.kind === 'segments' && (v.segments || []).length > 0 && html`<${ItemView} item=${item} value=${{ segments: v.segments }} player=${player} />`}
    ${(v.evidence || []).length > 0 && html`<div class="row-wrap" style=${{ gap: '6px' }}>${v.evidence.map((e) => html`<${TimeTag} e=${e} onSeek=${(x) => player.seekPlay(x)} />`)}</div>`}
    ${teKeyPoints(v)}
  </div>`;
}

// ── 학생 결과 (M4) ──────────────────────────────────
function TeStudentsPage() {
  const u = me();
  const groups = teacherStudents(u.id).filter((g) => g.cohort);
  const [cid, setCid] = useState(() => (groups[0] ? groups[0].cohort.id : ''));
  const [sel, setSel] = useState(null);
  const mobile = useMedia('(max-width: 767px)');
  const head = html`<div class="grow"><h2>학생 결과</h2><p>맡은 코호트 학생들의 영역별 점수와 제출 기록이에요. 학생을 누르면 자세히 볼 수 있어요.</p></div>`;
  if (!groups.length) return html`<div class="stack-lg"><div class="page-head">${head}</div><div class="card"><${Empty} icon="users" title="맡은 코호트가 없어요" desc="관리자가 코호트에 선생님으로 넣어 주면 학생 결과가 여기에 보여요." /></div></div>`;
  const g = groups.find((x) => x.cohort.id === cid) || groups[0];
  const weekAgo = now() - TE_WEEK;
  const last = (st) => Math.max(0, ...st.subs.map((s) => s.submittedAt || 0));
  const rows = g.students.map((s) => ({ user: s, st: studentStats(s.id) })).sort((a, b) => last(b.st) - last(a.st));
  const subs = rows.flatMap((r) => r.st.subs.filter((s) => s.submittedAt));
  const weekCount = subs.filter((s) => s.submittedAt >= weekAgo).length;
  const scored = rows.flatMap((r) => r.st.scored);
  const cohortAvg = scored.length ? Math.round(avg(scored.map((s) => s.evaluation.total))) : null;
  const areaAvg = {}; for (const a of AREAS) areaAvg[a.key] = scored.length ? Math.round(avg(scored.map((s) => s.evaluation.areas[a.key]))) : null;
  const weakest = scored.length ? AREAS.slice().sort((a, b) => areaAvg[a.key] - areaAvg[b.key])[0] : null;
  const selRow = rows.find((r) => r.user.id === sel);
  const pick = (id) => { if (sel === id) { setSel(null); return; } setSel(id); teScrollTo('te-student-detail'); };
  return html`<div class="stack-lg">
    <div class="page-head">${head}
      <select class="select te-select" value=${g.cohort.id} onChange=${(e) => { setCid(e.target.value); setSel(null); }} aria-label="코호트">
        ${groups.map((x) => html`<option value=${x.cohort.id}>${x.cohort.name} · 학생 ${x.students.length}명</option>`)}
      </select>
    </div>
    <div class="te-cq"><div class="te-stats">
      <${Stat} label="학생" value=${rows.length} unit="명" icon="users" sub=${`${g.cohort.name} · ${cohortState(g.cohort).label}`} />
      <${Stat} label="이번 주 제출" value=${weekCount} unit="개" icon="file" sub=${`지금까지 ${subs.length}개`} />
      <${Stat} label="코호트 평균" value=${cohortAvg == null ? '–' : cohortAvg} unit=${cohortAvg == null ? '' : '점'} icon="chart" sub=${`채점된 제출 ${scored.length}개`} />
      <${Stat} label="약한 영역" value=${weakest ? weakest.name : '–'} icon="target" sub=${weakest ? `코호트 평균 ${areaAvg[weakest.key]}점` : '채점된 제출이 없어요'} />
    </div></div>

    <div class="card">
      <div class="card-head"><h2 class="grow">학생별 점수</h2><span class="tiny muted">학생마다 가장 낮은 영역을 색으로 표시했어요</span></div>
      ${!rows.length ? html`<${Empty} icon="users" title="이 코호트에 학생이 없어요" />`
      : mobile ? html`<div>${rows.map(({ user, st }) => { const lastAt = last(st); return html`<button type="button" class="list-row" aria-current=${sel === user.id ? 'true' : null} onClick=${() => pick(user.id)}>
          <${Avatar} user=${user} size="sm" />
          <span class="grow stack-sm" style=${{ gap: '2px' }}><span class="strong">${user.name}</span><span class="tiny muted">채점 ${st.scored.length}개${st.weakest ? ` · 약한 영역 ${st.weakest.name}` : ''}${lastAt ? ` · ${fmtRel(lastAt)}` : ''}</span></span>
          <span class="te-score num">${st.avgTotal == null ? '–' : st.avgTotal}${st.avgTotal != null && html`<small>점</small>`}</span>
          <${Icon} name="chevR" size="sm" />
        </button>`; })}</div>`
      : html`<div class="table-wrap"><table class="table te-stable">
          <thead><tr><th>학생</th><th class="te-num">제출</th><th class="te-num">평균</th>${AREAS.map((a) => html`<th class="te-num">${a.name}</th>`)}<th>최근 제출</th></tr></thead>
          <tbody>${rows.map(({ user, st }) => { const low = st.weakest && st.weakest.key; const lastAt = last(st); return html`<tr class=${'clickable' + (sel === user.id ? ' te-sel' : '')} onClick=${() => pick(user.id)}>
            <td><div class="row" style=${{ gap: '10px' }}><${Avatar} user=${user} size="sm" /><span class="strong te-nowrap">${user.name}</span></div></td>
            <td class="te-num num">${st.scored.length}${st.pending.length > 0 && html`<span class="tiny muted"> +${st.pending.length}</span>`}</td>
            <td class="te-num num strong">${st.avgTotal == null ? '–' : st.avgTotal}</td>
            ${AREAS.map((a) => html`<td class="te-num num">${st.areaAvg[a.key] == null ? html`<span class="muted">–</span>` : html`<span class=${a.key === low ? 'te-low' : ''}>${st.areaAvg[a.key]}</span>`}</td>`)}
            <td class="muted te-nowrap">${lastAt ? fmtRel(lastAt) : '–'}</td>
          </tr>`; })}</tbody>
        </table></div>`}
    </div>

    ${selRow && html`<${TeStudentDetail} key=${selRow.user.id} row=${selRow} cohort=${g.cohort} onClose=${() => setSel(null)} />`}
  </div>`;
}

        ${s.status === 'scored' ? html`<span class="te-score num">${s.evaluation.total}<small>점</small></span>` : html`<${SubmissionBadge} sub=${s} />`}
        <${Icon} name=${isOpen ? 'chevU' : 'chevD'} size="sm" />

        <div class="te-fb">

          <div class="stack-sm"><span class="label">놓친 점</span>${s.evaluation.feedback.missed.length ? s.evaluation.feedback.missed.map((f) => html`<div class="row-top small" style=${{ gap: '8px' }}><span style=${{ color: 'var(--bad)', display: 'inline-flex', paddingTop: '2px' }}><${Icon} name="alert" size="sm" /></span><span>${f.text}</span></div>`) : html`<span class="small muted">크게 놓친 곳이 없어요</span>`}</div>

    </div>`; }) : html`<div class="card-pad small muted" style=${{ paddingTop: '4px' }}>아직 제출한 분석이 없어요.</div>`}
  </div>`;
}

// ── 도우미 ───────────────────────────────────────
const adMobileQuery = '(max-width: 767px)';
function adDateIn(ts) { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function adDateOut(str, endOfDay) { const [y, m, d] = String(str).split('-').map(Number); return endOfDay ? new Date(y, m - 1, d, 23, 59, 59).getTime() : new Date(y, m - 1, d).getTime(); }
function adDayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function adPeriod(c, long) { return long ? `${fmtDateLong(c.startsAt)} ~ ${fmtDateLong(c.endsAt)}` : `${fmtDate(c.startsAt)} ~ ${fmtDate(c.endsAt)}`; }
function adWeeks(c) { return Math.max(1, Math.round((c.endsAt - c.startsAt) / (7 * DAY))); }
function adPendingInvites(cohortId) { return db.invites.filter((i) => i.cohortId === cohortId && inviteState(i).key === 'pending'); }
function adCohortNames(userId) { return [...new Set(cohortsOf(userId).map((m) => m.cohort.name))]; }
function adUsd1000(v) { return '$' + Math.round(v * 1000).toLocaleString('en-US'); }
function adMatch(u, q) { const s = q.trim().toLowerCase(); return !s || u.name.toLowerCase().includes(s) || u.email.toLowerCase().includes(s); }
function adByName(id) { const u = id ? byId(db.users, id) : null; return u ? u.name : null; }
function adNormEngine(e) { return { engine: e.engine, model: e.model, effort: e.effort || 'low', fallback: { enabled: !!(e.fallback && e.fallback.enabled), engine: (e.fallback && e.fallback.engine) || 'openai-api', model: (e.fallback && e.fallback.model) || 'gpt-6.1-sol' } }; }

// 초대 이메일 정리: 중복, 형식 오류, 이미 멤버인 사람을 나눕니다
function adClassifyEmails(cohortId, raw) {
  const lines = String(raw || '').split(/[\n,;\s]+/).map((s) => s.trim()).filter(Boolean);
  const seen = new Set(); const valid = []; const bad = []; const members = []; let dup = 0;
  for (const l of lines) {
    const e = l.toLowerCase();
    if (seen.has(e)) { dup++; continue; }
    seen.add(e);
    if (!AD_EMAIL_RE.test(e)) { bad.push(l); continue; }
    const u = db.users.find((x) => x.email === e);
    if (u && db.members.some((m) => m.cohortId === cohortId && m.userId === u.id && m.role === 'student')) { members.push(e); continue; }
    valid.push(e);
  }
  const replace = db.invites.filter((i) => i.cohortId === cohortId && valid.includes(i.email) && inviteState(i).key === 'pending');
  return { valid, bad, members, dup, replace, total: lines.length };
}

// 최근 활동: 멤버 추가, 크레딧 지급, 새 계정, 초대 만들기
function adActivity() {
  const ev = [];
  for (const m of db.members) {
    const u = byId(db.users, m.userId); const c = byId(db.cohorts, m.cohortId); if (!u || !c) continue;
    const role = ROLE_LABEL[m.role];
    ev.push({ at: m.addedAt, icon: m.via === 'invite' ? 'ticket' : 'users',
      title: m.via === 'invite' ? `${u.name}님이 초대 링크로 ${c.name}에 들어왔어요` : `${u.name}님을 ${c.name}에 ${role}${josa(role, '으로/로')} 추가했어요`,
      sub: m.via === 'invite' ? `${role} · ${u.email}` : u.email, route: { name: 'cohort', params: { id: c.id } } });
  }
  const groups = new Map();
  for (const cr of db.credits) {
    if (cr.kind !== 'grant' && cr.kind !== 'revoke') continue;
    const key = `${cr.kind}|${cr.delta}|${cr.memo}|${cr.cohortId || ''}|${Math.round(cr.createdAt / 5000)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(cr);
  }
  for (const list of groups.values()) {
    const cr = list[0]; const n = list.length; const u = byId(db.users, cr.userId); const amt = Math.abs(cr.delta);
    const by = adByName(cr.by);
    let title; let route;
    if (n > 1) { title = `학생 ${n}명에게 크레딧 ${amt}개씩 지급했어요`; route = cr.cohortId ? { name: 'cohort', params: { id: cr.cohortId } } : { name: 'admin-credits', params: {} }; }
    else { const nm = u ? u.name : '사용자'; title = cr.delta > 0 ? `${nm}님에게 크레딧 ${amt}개를 지급했어요` : `${nm}님의 크레딧 ${amt}개를 회수했어요`; route = u ? { name: 'user', params: { id: u.id } } : null; }
    ev.push({ at: cr.createdAt, icon: 'coins', title, sub: cr.memo + (by ? ` · ${by}` : ''), route });
  }
  const ug = new Map();
  for (const u of db.users) { const k = Math.round(u.createdAt / 60000); if (!ug.has(k)) ug.set(k, []); ug.get(k).push(u); }
  for (const list of ug.values()) {
    const u = list[0];
    if (list.length === 1) ev.push({ at: u.createdAt, icon: 'user', title: `${u.name}님 계정이 생겼어요`, sub: `${u.email} · ${u.roles.map((r) => ROLE_LABEL[r]).join(', ') || '롤 없음'}`, route: { name: 'user', params: { id: u.id } } });
    else ev.push({ at: u.createdAt, icon: 'user', title: `계정 ${list.length}개가 생겼어요`, sub: list.slice(0, 3).map((x) => x.name).join(', ') + (list.length > 3 ? ` 외 ${list.length - 3}명` : ''), route: { name: 'users', params: {} } });
  }
  const ig = new Map();
  for (const i of db.invites) { const k = `${i.cohortId}|${Math.round(i.createdAt / 10000)}`; if (!ig.has(k)) ig.set(k, []); ig.get(k).push(i); }
  for (const list of ig.values()) {
    const i = list[0]; const c = byId(db.cohorts, i.cohortId); if (!c) continue;
    ev.push({ at: i.createdAt, icon: 'mail', title: `${c.name} 초대 링크 ${list.length}개를 만들었어요`, sub: list.slice(0, 2).map((x) => x.email).join(', ') + (list.length > 2 ? ` 외 ${list.length - 2}개` : ''), route: { name: 'cohort', params: { id: c.id, tab: 'invites' } } });
  }
  return ev.sort((a, b) => b.at - a.at);
}

// 최근 30일 사용량을 날짜별로 묶습니다
function adUsage(kind = 'all') {
  const start = adDayStart(now()) - 29 * DAY;
  const rows = db.usage.filter((x) => x.day >= start && (kind === 'all' || x.kind === kind));
  const days = Array.from({ length: 30 }, (_, i) => ({ at: start + i * DAY, jobs: 0 }));
  for (const r of rows) { const i = clamp(Math.round((adDayStart(r.day) - start) / DAY), 0, 29); days[i].jobs += r.count + r.failed; }
  const ok = sum(rows.map((r) => r.count));
  const failed = sum(rows.map((r) => r.failed));
  const ms = ok ? sum(rows.map((r) => r.ms * r.count)) / ok : 0;
  return { rows, days, ok, failed, jobs: ok + failed, ms, cost: sum(rows.map((r) => r.costUsd)) };
}

// 버튼에서 펼쳐지는 작은 양식 (popover-form). 휴대폰에서는 대화상자로 엽니다.
function AdPopForm({ label, icon, title, btnClass = 'btn btn-sm', left, width = 320, open, setOpen, children }) {
  const mobile = useMedia(adMobileQuery);
  const ref = useRef();
  const [up, setUp] = useState(false);
  const close = () => setOpen(false);
  const toggle = () => {
    if (!open && ref.current) { const r = ref.current.getBoundingClientRect(); const below = window.innerHeight - r.bottom; setUp(below < 440 && r.top > below); }
    setOpen(!open);
  };
  useOutside(ref, close, open && !mobile);
  useEffect(() => { if (open && !mobile && ref.current) { const el = ref.current.querySelector('.pop input, .pop select'); if (el) el.focus(); } }, [open]);
  return html`<span ref=${ref} style=${{ position: 'relative', display: 'inline-flex' }}>
    <button type="button" class=${btnClass} aria-expanded=${String(!!open)} aria-haspopup="dialog" onClick=${toggle}>${icon && html`<${Icon} name=${icon} size="sm" />`}${label}</button>
    ${open && (mobile
      ? html`<${Modal} title=${title} onClose=${close}>${children}<//>`
      : html`<div class=${'pop ad-popform' + (left ? ' pop-left' : '')} role="dialog" aria-label=${title} style=${{ width: width + 'px', ...(up ? { top: 'auto', bottom: 'calc(100% + 8px)' } : null) }}>
          <div class="row" style=${{ marginBottom: '10px' }}><span class="strong grow">${title}</span><button type="button" class="btn btn-ghost btn-icon btn-sm" style=${{ width: '26px', height: '26px' }} onClick=${close} aria-label="닫기"><${Icon} name="x" size="xs" /></button></div>
          ${children}
        </div>`)}
  </span>`;
}

// ── 코호트 만들기/고치기 ──────────────────────────
function AdCohortModal({ cohort, onClose }) {
  const t = now();
  const [f, setF] = useState(() => (cohort
    ? { name: cohort.name, desc: cohort.desc || '', start: adDateIn(cohort.startsAt), end: adDateIn(cohort.endsAt) }
    : { name: '', desc: '', start: adDateIn(t), end: adDateIn(t + 55 * DAY) }));
  const [err, setErr] = useState({});
  const set = (k) => (e) => { setF({ ...f, [k]: e.target.value }); setErr({ ...err, [k]: null }); };
  const submit = (e) => {
    if (e) e.preventDefault();
    const er = {}; const name = f.name.trim();
    if (!name) er.name = '이름을 적어 주세요.';
    else if (db.cohorts.some((c) => c.name === name && (!cohort || c.id !== cohort.id))) er.name = '같은 이름의 코호트가 이미 있어요.';
    if (!f.start) er.start = '시작일을 골라 주세요.';
    if (!f.end) er.end = '종료일을 골라 주세요.';
    if (f.start && f.end && f.end < f.start) er.end = '종료일이 시작일보다 빨라요.';
    setErr(er);
    if (Object.keys(er).length) return;
    const patch = { name, desc: f.desc.trim(), startsAt: adDateOut(f.start), endsAt: adDateOut(f.end, true) };
    if (cohort) { updateCohort(cohort.id, patch); onClose(); toast({ title: '코호트를 고쳤어요', body: `${name} · ${adPeriod(patch, true)}` }); return; }
    const r = createCohort(patch);
    if (!r.ok) { setErr({ name: r.error }); return; }
    onClose();
    toast({ title: `${name}${josa(name, '을/를')} 만들었어요`, body: '멤버를 추가하거나 초대 링크를 만들어 보세요.' });
    nav('cohort', { id: r.cohort.id });
  };
  const fid = cohort ? 'ad-cohort-edit' : 'ad-cohort-new';
  const days = f.start && f.end && f.end >= f.start ? Math.round((adDateOut(f.end) - adDateOut(f.start)) / DAY) + 1 : 0;
  return html`<${Modal} title=${cohort ? '코호트 고치기' : '코호트 만들기'} sub=${cohort ? null : '코호트는 같이 배우는 묶음이에요. 한 사람이 여러 코호트에 들어갈 수 있어요.'} onClose=${onClose}
    foot=${html`<button type="button" class="btn" onClick=${onClose}>닫기</button><button type="submit" form=${fid} class="btn btn-primary">${cohort ? '저장' : '만들기'}</button>`}>
    <form id=${fid} class="stack" onSubmit=${submit} novalidate>
      <${Field} label="이름" htmlFor=${fid + '-name'} error=${err.name}><input id=${fid + '-name'} class="input" value=${f.name} onInput=${set('name')} placeholder="예: 2027 봄 3기" aria-invalid=${err.name ? 'true' : null} /><//>
      <${Field} label="설명 (선택)" htmlFor=${fid + '-desc'}><input id=${fid + '-desc'} class="input" value=${f.desc} onInput=${set('desc')} placeholder="예: 쇼츠 기획 입문 8주 과정" /><//>
      <div class="ad-fields">
        <${Field} label="시작일" htmlFor=${fid + '-start'} error=${err.start}><input id=${fid + '-start'} class="input" type="date" value=${f.start} onInput=${set('start')} aria-invalid=${err.start ? 'true' : null} /><//>
        <${Field} label="종료일" htmlFor=${fid + '-end'} error=${err.end}><input id=${fid + '-end'} class="input" type="date" value=${f.end} min=${f.start || null} onInput=${set('end')} aria-invalid=${err.end ? 'true' : null} /><//>
      </div>
      ${days > 0 && html`<div class="tiny muted">${days}일 · 약 ${Math.max(1, Math.round(days / 7))}주. 시작일 전에는 '시작 전', 종료일이 지나면 '끝남'으로 보여요.</div>`}
    </form>
  <//>`;
}

function AdGrantForm({ cohortId, onDone, withSelect }) {
  const choices = db.cohorts.filter((c) => cohortState(c).key !== 'ended');
  const [cid, setCid] = useState(cohortId || (choices[0] || db.cohorts[0] || {}).id || '');
  const [amount, setAmount] = useState('5');
  const [memo, setMemo] = useState('');
  const [err, setErr] = useState('');
  const c = byId(db.cohorts, cid);
  const students = c ? cohortMembers(c.id, 'student').map((m) => byId(db.users, m.userId)).filter(Boolean) : [];
  const targets = students.filter(usesCredits);
  const skipped = students.length - targets.length;
  const n = Math.trunc(Number(amount)) || 0;
  const submit = (e) => {
    e.preventDefault(); setErr('');
    if (!c) { setErr('코호트를 골라 주세요.'); return; }
    if (n < 1) { setErr('1 이상으로 적어 주세요.'); return; }
    const r = grantCohort(c.id, n, memo.trim());
    if (!r.ok) { setErr(r.error); return; }
    toast({ title: `학생 ${r.count}명에게 크레딧 ${n}개씩 지급했어요`, body: `${c.name} · 모두 ${r.count * n}개` });
    setMemo('');
    onDone && onDone({ count: r.count, amount: n, cohort: c });
  };
  return html`<form class="stack" style=${{ gap: '12px' }} onSubmit=${submit} novalidate>
    ${withSelect && html`<${Field} label="코호트" htmlFor="ad-grant-cohort"><select id="ad-grant-cohort" class="select" value=${cid} onChange=${(e) => { setCid(e.target.value); setErr(''); }}>
      ${db.cohorts.map((x) => html`<option value=${x.id}>${x.name} (${cohortState(x).label} · 학생 ${cohortMembers(x.id, 'student').length}명)</option>`)}
    </select><//>`}
    <div class="ad-fields">
      <${Field} label="1명당 수량" htmlFor=${'ad-grant-amt-' + (cohortId || 'any')}><input id=${'ad-grant-amt-' + (cohortId || 'any')} class="input" type="number" inputmode="numeric" min="1" step="1" value=${amount} onInput=${(e) => { setAmount(e.target.value); setErr(''); }} /><//>
      <${Field} label="메모 (선택)" htmlFor=${'ad-grant-memo-' + (cohortId || 'any')}><input id=${'ad-grant-memo-' + (cohortId || 'any')} class="input" value=${memo} onInput=${(e) => setMemo(e.target.value)} placeholder=${c ? `${c.name} 일괄 지급` : '메모'} /><//>
    </div>
    <div class="small soft">${targets.length ? html`크레딧을 쓰는 학생 <b>${targets.length}명</b>에게 ${n > 0 ? `${n}개씩, 모두 ${targets.length * n}개를` : '같은 수량을'} 지급해요.` : '이 코호트에는 크레딧을 쓰는 학생이 없어요.'}${skipped > 0 ? ` 선생님이나 관리자 롤도 있는 ${skipped}명은 무료라서 빠져요.` : ''}</div>
    ${err && html`<div class="error-text" role="alert">${err}</div>`}
    <button type="submit" class="btn btn-primary" disabled=${!targets.length}><${Icon} name="gift" size="sm" />지급</button>
  </form>`;
}

function AdInviteModal({ cohort, initial, onClose }) {

    for (const inv of cl.replace) inv.revokedAt = now();
    const r = createInvites(cohort.id, cl.valid, Number(days));
    setDone({ ...r, members: cl.members, dup: cl.dup, replaced: cl.replace.length, bad: [...cl.bad, ...r.bad] });

      <div class="stack" style=${{ gap: '10px' }}>${done.created.map((inv) => html`<div class="stack-sm" key=${inv.id}><span class="small strong">${inv.email}</span><${CopyField} value=${inviteUrl(inv)} label=${inv.email + ' 초대 링크'} /></div>`)}</div>
      ${done.bad.length > 0 && html`<${Callout} tone="bad" icon="alert">이메일 형식이 아니라서 빼고 만들었어요: <span class="mono">${done.bad.join(', ')}</span><//>`}
      ${done.members.length > 0 && html`<${Callout} tone="neutral" icon="users">이미 이 코호트 학생이라 건너뛰었어요: ${done.members.join(', ')}<//>`}
      ${(done.replaced > 0 || done.dup > 0) && html`<div class="tiny muted">${done.replaced > 0 ? `같은 이메일로 대기 중이던 초대 ${done.replaced}개는 자동으로 취소했어요. ` : ''}${done.dup > 0 ? `두 번 적은 이메일 ${done.dup}개는 하나로 합쳤어요.` : ''}</div>`}
      <div class="tiny muted">실제 서비스에서는 링크 원문을 만든 직후에만 보여 줘요. 프로토타입에서는 초대 목록에서 다시 복사할 수 있어요.</div>
    <//>`;

    foot=${html`<button type="button" class="btn" onClick=${onClose}>닫기</button><button type="submit" form="ad-invite-form" class="btn btn-primary" disabled=${!cl.valid.length}><${Icon} name="link" size="sm" />${cl.valid.length ? `링크 ${cl.valid.length}개 만들기` : '링크 만들기'}</button>`}>

      <button type="button" class="btn btn-sm" onClick=${() => extend(inv)} title="만료일을 7일 늘려요">+7일</button>
      ${mobile
        ? html`<button type="button" class="btn btn-sm btn-danger" onClick=${() => setRevoking(inv)} aria-label=${inv.email + ' 초대 취소'}>취소</button>`
        : html`<button type="button" class="btn btn-sm btn-icon btn-danger" onClick=${() => setRevoking(inv)} title="초대 취소" aria-label=${inv.email + ' 초대 취소'}><${Icon} name="x" size="xs" /></button>`}
    </div>`;
    if (k === 'expired') return html`<div class="ad-actions"><button type="button" class="btn btn-sm" onClick=${() => extend(inv)} title="오늘부터 7일 더 쓸 수 있게 해요">+7일 연장</button></div>`;
    if (k === 'used' && inv.usedBy) return html`<div class="ad-actions"><button type="button" class="btn btn-sm btn-ghost" onClick=${() => nav('user', { id: inv.usedBy })}>사용자 보기</button></div>`;

  const joined = (inv) => {
    const k = inviteState(inv).key;
    if (k === 'used') { const u = byId(db.users, inv.usedBy); return u ? html`<div class="stack-sm" style=${{ gap: 0 }}><span class="small strong">${u.name}</span><span class="tiny muted">${fmtRel(inv.usedAt)} 참여</span></div>` : html`<span class="muted">–</span>`; }
    if (k === 'revoked') return html`<span class="tiny muted">${fmtDate(inv.revokedAt)} 취소</span>`;
    return html`<span class="muted">–</span>`;
  };
  return html`<div class="stack-lg">
    <div class="card card-pad">
      <div class="row-top" style=${{ gap: '16px', flexWrap: 'wrap' }}>
        <div class="grow stack-sm" style=${{ gap: '6px', minWidth: '240px' }}>
          <div class="row-wrap" style=${{ gap: '8px' }}><h2 style=${{ fontSize: '20px' }}>${c.name}</h2><${AdCohortBadge} cohort=${c} /></div>

          <div class="row-wrap small muted" style=${{ gap: '6px 16px' }}>

            <span class="row" style=${{ gap: '6px' }}><${Icon} name="users" size="xs" />학생 ${nStudents} · 선생님 ${nTeachers}</span>

          ${st.key === 'upcoming' && html`<div class="tiny muted">시작 전이에요. 초대 링크를 미리 보내 둘 수 있어요.</div>`}
          ${st.key === 'ended' && html`<div class="tiny muted">끝난 코호트예요. 멤버와 기록은 그대로 남아 있어요.</div>`}
        </div>
        <div class="row-wrap" style=${{ gap: '8px' }}>
          <button type="button" class="btn btn-sm" onClick=${() => setEditing(true)}><${Icon} name="pen" size="xs" />수정</button>
          <${AdPopForm} label="크레딧 일괄 지급" icon="coins" title="크레딧 일괄 지급" open=${grantOpen} setOpen=${setGrantOpen} width=${340}>
            <${AdGrantForm} cohortId=${c.id} onDone=${() => setGrantOpen(false)} />
          <//>
        </div>
      </div>
    </div>

    <div class="row-wrap" style=${{ justifyContent: 'space-between' }}>
      <${Seg} label="코호트 상세" value=${tab} onChange=${setTab} options=${[{ value: 'members', label: '멤버', count: members.length }, { value: 'invites', label: '초대', count: invites.length }]} />
      ${tab === 'members'
        ? html`<button type="button" class="btn btn-primary btn-sm" onClick=${() => setAdding(true)}><${Icon} name="plus" size="sm" />멤버 추가</button>`
        : html`<button type="button" class="btn btn-primary btn-sm" onClick=${() => setInviting({ emails: '' })}><${Icon} name="link" size="sm" />초대 만들기</button>`}
    </div>

    ${tab === 'members' ? html`<div class="card">
      ${!members.length ? html`<${Empty} icon="users" title="아직 멤버가 없어요" desc="이미 계정이 있으면 직접 넣고, 없으면 초대 링크를 보내요." action=${html`<div class="row-wrap" style=${{ gap: '8px', justifyContent: 'center' }}><button type="button" class="btn btn-sm" onClick=${() => setAdding(true)}>멤버 추가</button><button type="button" class="btn btn-sm btn-primary" onClick=${() => setInviting({ emails: '' })}>초대 만들기</button></div>`} />`
      : mobile ? html`<div>${members.map(({ m, u }) => html`<div class="list-row" key=${m.userId + m.role} style=${{ alignItems: 'flex-start' }}>
          <${Avatar} user=${u} />
          <div class="grow stack-sm" style=${{ gap: '3px' }}>
            <div class="row" style=${{ gap: '8px' }}><span class="strong grow ellipsis">${u.name}</span><${AdRoleBadge} role=${m.role} /></div>
            <span class="tiny muted ellipsis">${u.email}</span>
            <span class="tiny muted">${AD_VIA_LABEL[m.via] || '직접 추가'} · ${fmtDate(m.addedAt)} 추가 · 크레딧 ${usesCredits(u) ? balanceOf(u.id) : '무료'}</span>
            <div class="row" style=${{ gap: '6px', marginTop: '4px' }}><button type="button" class="btn btn-sm" onClick=${() => nav('user', { id: u.id })}>사용자 보기</button><button type="button" class="btn btn-sm btn-danger" onClick=${() => setRemoving({ m, u })}>빼기</button></div>
          </div>
        </div>`)}</div>`
      : html`<div class="table-wrap"><table class="table">
          <thead><tr><th>사용자</th><th>코호트 롤</th><th>들어온 방법</th><th>추가일</th><th class="ad-r">크레딧</th><th></th></tr></thead>
          <tbody>${members.map(({ m, u }) => html`<tr key=${m.userId + m.role}>
            <td style=${{ maxWidth: '240px' }}><${AdUserCell} user=${u} /></td>
            <td><${AdRoleBadge} role=${m.role} /></td>
            <td class="soft">${m.via === 'invite' ? html`<span class="row" style=${{ gap: '5px' }}><${Icon} name="ticket" size="xs" />초대</span>` : '직접 추가'}</td>
            <td style=${{ whiteSpace: 'nowrap' }}><span class="num">${fmtDate(m.addedAt)}</span>${fmtRel(m.addedAt) !== fmtDate(m.addedAt) && html` <span class="tiny muted">${fmtRel(m.addedAt)}</span>`}</td>
            <td class="ad-r"><${AdCredit} user=${u} /></td>
            <td><div class="ad-actions"><button type="button" class="btn btn-sm btn-ghost" onClick=${() => nav('user', { id: u.id })}>사용자 보기</button><button type="button" class="btn btn-sm btn-ghost btn-danger" onClick=${() => setRemoving({ m, u })}>빼기</button></div></td>
          </tr>`)}</tbody>
        </table></div>`}
    </div>` : html`<div class="card">
      <div class="card-head">
        <${Seg} label="초대 상태" value=${invF} onChange=${setInvF} options=${[{ value: 'all', label: '전체', count: ic('all') }, { value: 'pending', label: '대기 중', count: ic('pending') }, { value: 'used', label: '참여함', count: ic('used') }, { value: 'expired', label: '만료됨', count: ic('expired') }, { value: 'revoked', label: '취소됨', count: ic('revoked') }]} />
        <span class="spacer"></span>
        <span class="card-sub">한 사람 전용 · 한 번만 · 기간이 지나면 만료</span>
      </div>
      ${!invites.length ? html`<${Empty} icon="ticket" title="아직 만든 초대가 없어요" desc="이메일을 넣으면 사람마다 다른 링크가 만들어져요." action=${html`<button type="button" class="btn btn-sm btn-primary" onClick=${() => setInviting({ emails: '' })}>초대 만들기</button>`} />`
      : !invRows.length ? html`<${Empty} icon="filter" title="이 상태의 초대가 없어요" />`
      : mobile ? html`<div>${invRows.map((inv) => { const k = inviteState(inv).key; const u = inv.usedBy && byId(db.users, inv.usedBy); return html`<div class="list-row" key=${inv.id} style=${{ alignItems: 'flex-start' }}>
          <div class="grow stack-sm" style=${{ gap: '3px' }}>
            <div class="row" style=${{ gap: '8px' }}><span class="strong small grow ellipsis">${inv.email}</span><${AdInviteBadge} inv=${inv} /></div>
            <span class="tiny muted">${k === 'pending' ? `${fmtDateLong(inv.expiresAt)}까지 · ${fmtRel(inv.expiresAt)}` : k === 'used' ? `${u ? u.name : '알 수 없음'} · ${fmtRel(inv.usedAt)} 참여` : k === 'expired' ? `${fmtDateLong(inv.expiresAt)}에 만료` : `${fmtDateLong(inv.revokedAt)}에 취소`}</span>
            ${invActions(inv) && html`<div style=${{ marginTop: '4px' }}>${invActions(inv)}</div>`}
          </div>
        </div>`; })}</div>`
      : html`<div class="table-wrap"><table class="table">
          <thead><tr><th>이메일</th><th>상태</th><th>만료일</th><th>참여한 사람</th><th></th></tr></thead>
          <tbody>${invRows.map((inv) => html`<tr key=${inv.id}>
            <td style=${{ maxWidth: '200px' }}><div class="stack-sm" style=${{ gap: 0 }}><span class="small strong ellipsis" title=${inv.email}>${inv.email}</span><span class="tiny muted">${fmtDate(inv.createdAt)} 만듦${adByName(inv.createdBy) ? ' · ' + adByName(inv.createdBy) : ''}</span></div></td>
            <td><${AdInviteBadge} inv=${inv} /></td>
            <td style=${{ whiteSpace: 'nowrap' }}><div class="stack-sm" style=${{ gap: 0 }}><span class="small num">${fmtDateLong(inv.expiresAt)}</span><span class="tiny muted">${inviteState(inv).key === 'pending' || inviteState(inv).key === 'expired' ? fmtRel(inv.expiresAt) : ''}</span></div></td>
            <td>${joined(inv)}</td>
            <td>${invActions(inv)}</td>
          </tr>`)}</tbody>
        </table></div>`}
    </div>`}

    ${editing && html`<${AdCohortModal} cohort=${c} onClose=${() => setEditing(false)} />`}
    ${adding && html`<${AdAddMemberModal} cohort=${c} onClose=${() => setAdding(false)} onInvite=${(email) => { setAdding(false); setTab('invites'); setInviting({ emails: email }); }} />`}
    ${inviting && html`<${AdInviteModal} cohort=${c} initial=${inviting.emails} onClose=${() => setInviting(null)} />`}
    ${removing && html`<${AdConfirm} title=${`${removing.u.name}님을 코호트에서 뺄까요?`} confirmLabel="빼기" onClose=${() => setRemoving(null)} onConfirm=${() => { removeMember(c.id, removing.u.id, removing.m.role); toast({ title: `${removing.u.name}님을 뺐어요`, body: `${c.name} ${ROLE_LABEL[removing.m.role]}` }); }}>
      ${c.name}의 ${ROLE_LABEL[removing.m.role]} 목록에서만 빠져요. 계정, 롤, 크레딧, 제출한 분석은 그대로 남아요.
    <//>`}
    ${revoking && html`<${AdConfirm} title="초대를 취소할까요?" confirmLabel="초대 취소" onClose=${() => setRevoking(null)} onConfirm=${() => { revokeInvite(revoking.id); toast({ title: '초대를 취소했어요', body: `${revoking.email} 링크는 이제 열리지 않아요` }); }}>
      <b>${revoking.email}</b>에게 보낸 링크가 바로 막혀요. 다시 초대하려면 새 링크를 만들어야 해요.
    <//>`}
  </div>`;
}

function AdAddUserModal({ onClose }) {
  const [f, setF] = useState({ name: '', email: '', roles: ['student'], cohortId: '' });
  const [err, setErr] = useState('');
  const [done, setDone] = useState(null);
  const cohorts = db.cohorts.filter((c) => cohortState(c).key !== 'ended');
  const toggleRole = (r) => setF({ ...f, roles: f.roles.includes(r) ? f.roles.filter((x) => x !== r) : [...f.roles, r] });
  const memberRole = f.roles.includes('teacher') && !f.roles.includes('student') ? 'teacher' : 'student';
  const submit = (e) => {
    if (e) e.preventDefault(); setErr('');
    if (f.cohortId && !f.roles.includes('student') && !f.roles.includes('teacher')) { setErr('코호트에 넣으려면 학생이나 선생님 롤을 골라 주세요.'); return; }
    const r = createUser(f);
    if (!r.ok) { setErr(r.error); return; }
    setDone({ user: r.user, cohort: f.cohortId ? byId(db.cohorts, f.cohortId) : null, role: memberRole });
    toast({ title: `${r.user.name}님 계정을 만들었어요`, body: r.user.email });
  };
  if (done) {
    const u = done.user;
    return html`<${Modal} title="계정을 만들었어요" onClose=${onClose}
      foot=${html`<button type="button" class="btn" onClick=${() => { setDone(null); setF({ name: '', email: '', roles: ['student'], cohortId: f.cohortId }); }}>하나 더 추가</button><button type="button" class="btn btn-primary" onClick=${() => { onClose(); nav('user', { id: u.id }); }}>사용자 보기<${Icon} name="arrowR" size="sm" /></button>`}>
      <div class="row"><${Avatar} user=${u} ring /><div class="grow stack-sm" style=${{ gap: 0 }}><span class="strong">${u.name}</span><span class="small muted">${u.email}</span></div><${RoleBadges} roles=${u.roles} /></div>
      <${Field} label="처음 비밀번호" hint="처음 로그인한 뒤 설정에서 바꾸도록 알려 주세요."><${CopyField} value=${DEMO_PASSWORD} label="처음 비밀번호" /><//>
      <div class="stack-sm small soft">
        ${done.cohort && html`<span class="row" style=${{ gap: '6px' }}><${Icon} name="users" size="xs" />${done.cohort.name}에 ${ROLE_LABEL[done.role]}${josa(ROLE_LABEL[done.role], '으로/로')} 넣었어요.</span>`}
        ${usesCredits(u) ? html`<span class="row" style=${{ gap: '6px' }}><${Icon} name="gift" size="xs" />가입 보너스로 크레딧 3개를 드렸어요.</span>` : u.roles.length ? html`<span class="row" style=${{ gap: '6px' }}><${Icon} name="check" size="xs" />선생님이나 관리자 롤이 있어서 크레딧 없이 무료로 써요.</span>` : html`<span class="row" style=${{ gap: '6px' }}><${Icon} name="lock" size="xs" />롤이 없어서 로그인하면 안내 화면만 보여요.</span>`}
      </div>
    <//>`;
  }
  return html`<${Modal} title="사용자 추가" sub="공개 가입이 없어서 운영자가 계정을 직접 만들어요. 처음 비밀번호는 정해진 값으로 시작해요." onClose=${onClose}
    foot=${html`<button type="button" class="btn" onClick=${onClose}>닫기</button><button type="submit" form="ad-user-form" class="btn btn-primary">계정 만들기</button>`}>
    <form id="ad-user-form" class="stack" onSubmit=${submit} novalidate>
      <div class="ad-fields">
        <${Field} label="이름" htmlFor="ad-user-name"><input id="ad-user-name" class="input" value=${f.name} onInput=${(e) => { setF({ ...f, name: e.target.value }); setErr(''); }} placeholder="홍길동" /><//>
        <${Field} label="이메일" htmlFor="ad-user-email"><input id="ad-user-email" class="input" type="email" value=${f.email} onInput=${(e) => { setF({ ...f, email: e.target.value }); setErr(''); }} placeholder="name@example.com" /><//>
      </div>
      <div class="field"><span class="label">롤</span>
        <div class="stack-sm">${ROLE_ORDER.map((r) => html`<label class="ad-check-row"><input type="checkbox" checked=${f.roles.includes(r)} onChange=${() => toggleRole(r)} /><span class="stack-sm" style=${{ gap: 0 }}><span class="small strong">${ROLE_LABEL[r]}</span><span class="tiny muted">${AD_ROLE_DESC[r]}</span></span></label>`)}</div>
      </div>
      <${Field} label="코호트 (선택)" htmlFor="ad-user-cohort" hint=${f.cohortId ? `${ROLE_LABEL[memberRole]}${josa(ROLE_LABEL[memberRole], '으로/로')} 들어가요` : '나중에 사용자 상세에서 넣어도 돼요'}>
        <select id="ad-user-cohort" class="select" value=${f.cohortId} onChange=${(e) => setF({ ...f, cohortId: e.target.value })}>
          <option value="">코호트 없음</option>
          ${cohorts.map((c) => html`<option value=${c.id}>${c.name} (${cohortState(c).label})</option>`)}
        </select>
      <//>
      ${err && html`<${Callout} tone="bad" icon="alert">${err}<//>`}
    </form>
  <//>`;
}

      : mobile ? html`<div>${rows.map((u) => { const cs = adCohortNames(u.id); return html`<button type="button" class="list-row" key=${u.id} onClick=${() => open(u)} style=${{ alignItems: 'flex-start' }}>

      : html`<div class="table-wrap"><table class="table">

function AdUserCreditForm({ user, onDone }) {
  const [sign, setSign] = useState('+');
  const [amount, setAmount] = useState('3');
  const [memo, setMemo] = useState('');
  const [err, setErr] = useState('');
  const bal = balanceOf(user.id);
  const n = Math.trunc(Number(amount)) || 0;
  const after = sign === '+' ? bal + n : bal - n;
  const submit = (e) => {
    e.preventDefault(); setErr('');
    if (n < 1) { setErr('1 이상으로 적어 주세요.'); return; }
    const r = grantCredits(user.id, sign === '+' ? n : -n, memo.trim());
    if (!r.ok) { setErr(r.error); return; }
    toast({ title: sign === '+' ? `크레딧 ${n}개를 지급했어요` : `크레딧 ${n}개를 회수했어요`, body: `${user.name} · 잔액 ${balanceOf(user.id)}개` });
    setMemo(''); onDone && onDone();
  };
  return html`<form class="stack" style=${{ gap: '12px' }} onSubmit=${submit} novalidate>
    <${Seg} label="지급 또는 회수" value=${sign} onChange=${(v) => { setSign(v); setErr(''); }} options=${[{ value: '+', label: '+ 지급' }, { value: '-', label: '− 회수' }]} />
    <${Field} label="수량" htmlFor="ad-credit-amt"><input id="ad-credit-amt" class="input" type="number" inputmode="numeric" min="1" step="1" value=${amount} onInput=${(e) => { setAmount(e.target.value); setErr(''); }} aria-invalid=${err ? 'true' : null} /><//>
    <${Field} label="메모 (선택)" htmlFor="ad-credit-memo" hint="사용자의 내 크레딧 내역에 보여요"><input id="ad-credit-memo" class="input" value=${memo} onInput=${(e) => setMemo(e.target.value)} placeholder=${sign === '+' ? '예: 과제 우수 보너스' : '예: 잘못 지급해서 회수'} /><//>
    <div class="row small soft" style=${{ gap: '6px' }}>잔액 <b class="num">${bal}</b><${Icon} name="arrowR" size="xs" /><b class="num" style=${{ color: after < 0 ? 'var(--bad)' : null }}>${n > 0 ? after : bal}</b></div>
    ${err && html`<div class="error-text" role="alert">${err}</div>`}
    <button type="submit" class=${'btn ' + (sign === '+' ? 'btn-primary' : 'ad-danger-solid')}>${sign === '+' ? `${n > 0 ? n + '개 ' : ''}지급하기` : `${n > 0 ? n + '개 ' : ''}회수하기`}</button>
  </form>`;
}
